<section id="page-personal-info" class="page">

  <style>
    /* ---------- Education documents (certificates & other papers per qualification) ---------- */
    #page-personal-info .education-docs {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px dashed var(--border);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    #page-personal-info .education-doc-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12.5px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
    }
    #page-personal-info .education-doc-icon { flex-shrink: 0; }
    #page-personal-info .education-doc-name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text);
      font-weight: 600;
    }
    #page-personal-info .education-doc-download {
      flex-shrink: 0;
      color: var(--navy);
      font-weight: 700;
      text-decoration: none;
      font-size: 12px;
    }
    #page-personal-info .education-doc-download:hover { text-decoration: underline; }
    #page-personal-info .education-doc-remove {
      flex-shrink: 0;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--danger);
      font-size: 13px;
      padding: 2px 4px;
    }
    #page-personal-info .education-doc-add-btn {
      align-self: flex-start;
      background: none;
      border: 1px dashed var(--accent);
      border-radius: 8px;
      color: var(--accent);
      font-size: 12.5px;
      font-weight: 600;
      padding: 6px 12px;
      cursor: pointer;
      font-family: inherit;
    }
    #page-personal-info .education-doc-add-btn:hover { background: var(--accent-soft); }
    #page-personal-info .education-doc-hint { font-size: 11.5px; color: var(--text-muted); }
    #page-personal-info .education-remove-hint { font-size: 12px; color: var(--danger); margin: 6px 0 8px; }
    #page-personal-info .education-row-divider { border: none; border-top: 1px solid var(--border); margin: 14px 0; }

    /* ---------- Age Calculator ---------- */
    #page-personal-info .age-cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 16px;
    }
    #page-personal-info .age-card {
      position: relative;
      aspect-ratio: 1 / 1;
      background: linear-gradient(150deg, #DFF6E4, #B9EAC4);
      border: 1px solid #8FDBA3;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 14px 10px;
      text-align: center;
      overflow: hidden;
    }
    #page-personal-info .age-card-edit {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.75);
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #page-personal-info .age-card-edit:hover { background: #fff; }
    #page-personal-info .age-card-photo {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      overflow: hidden;
      background: #ffffff;
      border: 2px solid #ffffff;
      box-shadow: 0 2px 6px rgba(16,35,63,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 20px;
      color: var(--navy);
      flex-shrink: 0;
    }
    #page-personal-info .age-card-photo img { width: 100%; height: 100%; object-fit: cover; }
    #page-personal-info .age-card-name {
      font-size: 13px;
      font-weight: 700;
      color: var(--navy);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 100%;
    }
    #page-personal-info .age-card-age {
      font-size: 11.5px;
      font-weight: 600;
      color: #1E6B3A;
      line-height: 1.4;
    }
    #page-personal-info .age-card-clock {
      font-size: 10px;
      color: #3C7A54;
      font-weight: 500;
    }
    #page-personal-info .age-card-add {
      aspect-ratio: 1 / 1;
      background: var(--bg);
      border: 2px dashed var(--border);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
    }
    #page-personal-info .age-card-add:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--navy); }
    #page-personal-info .age-card-add .plus { font-size: 26px; line-height: 1; color: var(--accent); }
    #page-personal-info .age-modal-photo-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    #page-personal-info .age-modal-photo-preview {
      width: 56px; height: 56px;
      border-radius: 50%;
      overflow: hidden;
      background: var(--accent-soft);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; color: var(--navy); font-size: 18px;
      flex-shrink: 0;
    }
    #page-personal-info .age-modal-photo-preview img { width: 100%; height: 100%; object-fit: cover; }

    @media (max-width: 480px) {
      #page-personal-info .age-cards-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; }
    }
  </style>

  <div class="subtabs">
    <button class="subtab-btn active" data-subtab="profile">প্রোফাইল</button>
    <button class="subtab-btn" data-subtab="family-tree">ফ্যামিলি ট্রি</button>
    <button class="subtab-btn" data-subtab="age-calculator">বয়স ক্যালকুলেটর</button>
  </div>

  <div class="subtab-panel active" id="subtab-profile">

    <div class="card profile-card">
      <div class="profile-card-header">
        <div>
          <h2 class="profile-card-title">ব্যক্তিগত তথ্য</h2>
          <p class="profile-card-subtitle">আপনার ব্যক্তিগত তথ্য ও প্রোফাইল তথ্যসমূহ এখানে দেখুন ও আপডেট করুন।</p>
        </div>
        <button type="button" class="btn btn-outline" id="btnEditProfile">✏️ তথ্য সম্পাদনা করুন</button>
      </div>

      <div class="profile-card-body">
        <div class="profile-photo-col">
          <div class="profile-photo-wrap" id="profilePhotoWrap">
            <div class="profile-photo-fallback" id="profilePhotoFallback">?</div>
          </div>
          <button type="button" class="btn btn-outline profile-photo-btn" id="btnChangeProfilePhotoPI">📷 ছবি পরিবর্তন করুন</button>
          <div class="profile-photo-hint">JPG, PNG (Max 2MB)</div>
        </div>

        <div class="profile-fields-col" id="profileFieldsView">
          <div class="profile-empty">লোড হচ্ছে...</div>
        </div>
      </div>
    </div>

    <div class="card profile-contact-card" id="profileContactCard" style="display:none;">
      <div class="home-card-title">যোগাযোগ ও অন্যান্য তথ্য</div>
      <div class="profile-fields-col" id="profileContactView"></div>
    </div>

    <div class="card education-card">
      <div class="education-card-header">
        <div class="education-card-title">🎓 শিক্ষাগত যোগ্যতা</div>
        <button type="button" class="education-edit-link" id="btnEditEducation">সম্পাদনা</button>
      </div>
      <div class="education-timeline" id="educationTimeline">
        <div class="profile-empty">লোড হচ্ছে...</div>
      </div>
    </div>

  </div>

  <div class="subtab-panel" id="subtab-family-tree">
    <div class="page-placeholder">
      <h2>ফ্যামিলি ট্রি</h2>
      <p>এই সেকশনের কন্টেন্ট পরবর্তী ধাপে যুক্ত হবে।</p>
    </div>
  </div>

  <div class="subtab-panel" id="subtab-age-calculator">
    <div class="card">
      <div class="education-card-header">
        <div class="education-card-title">🎂 বয়স ক্যালকুলেটর</div>
      </div>
      <div class="age-cards-grid" id="ageCardsGrid">
        <div class="profile-empty">লোড হচ্ছে...</div>
      </div>
    </div>
  </div>

</section>

<script>
  (function () {
    if (window.__personalInfoInit) return;
    window.__personalInfoInit = true;

    var TOKEN_KEY = 'personalAppSessionToken';

    // localStorage can throw inside the sandboxed Apps Script iframe on
    // some browsers (third-party storage restrictions) — never let a
    // read of the token crash this page.
    function getToken_() {
      try { return localStorage.getItem(TOKEN_KEY); } catch (e) { return null; }
    }

    var BN_DIGITS = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
    function bnDigits_(v) {
      return String(v).replace(/[0-9]/g, function (d) { return BN_DIGITS[Number(d)]; });
    }

    var BN_MONTHS = ['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
    function formatDateBn_(isoStr) {
      if (!isoStr) return '';
      var d = new Date(isoStr);
      if (isNaN(d.getTime())) return isoStr;
      return bnDigits_(d.getDate()) + ' ' + BN_MONTHS[d.getMonth()] + ' ' + bnDigits_(d.getFullYear());
    }

    function escapeHtml_(str) {
      return String(str || '').replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function readFileAsBase64_(file, onDone, onError) {
      var reader = new FileReader();
      reader.onload = function () { onDone(String(reader.result).split(',')[1] || ''); };
      reader.onerror = onError;
      reader.readAsDataURL(file);
    }

    /* ---------- Field definitions ---------- */
    var MAIN_FIELDS = [
      { key: 'NameBn', label: 'নাম (বাংলা)', icon: '👤', span: 2 },
      { key: 'NameEn', label: 'নাম (English)', icon: '🌐', span: 2 },
      { key: 'Father', label: 'পিতা', icon: '👨', span: 2 },
      { key: 'Mother', label: 'মাতা', icon: '👩', span: 2 },
      { key: 'DOB', label: 'জন্ম তারিখ', icon: '🎂', span: 1, type: 'date' },
      { key: 'Nationality', label: 'জাতীয়তা', icon: '🌍', span: 1 },
      { key: 'BloodGroup', label: 'রক্তের গ্রুপ', icon: '🩸', span: 1, type: 'select',
        options: ['A+','A-','B+','B-','AB+','AB-','O+','O-'] },
      { key: 'Religion', label: 'ধর্ম', icon: '🕌', span: 1 },
      { key: 'MaritalStatus', label: 'বৈবাহিক অবস্থা', icon: '💍', span: 2, type: 'select',
        options: ['অবিবাহিত','বিবাহিত','বিধবা/বিপত্নীক','তালাকপ্রাপ্ত'] },
      { key: 'Spouse', label: 'স্ত্রী/স্বামী', icon: '💑', span: 2 },
      { key: 'Children', label: 'সন্তান', icon: '👶', span: 2 }
    ];

    var CONTACT_FIELDS = [
      { key: 'Phone', label: 'ফোন', icon: '📞', span: 1 },
      { key: 'Email', label: 'ইমেইল', icon: '✉️', span: 1 },
      { key: 'PermanentAddress', label: 'স্থায়ী ঠিকানা', icon: '🏠', span: 2, type: 'textarea' },
      { key: 'CurrentAddress', label: 'বর্তমান ঠিকানা', icon: '📍', span: 2, type: 'textarea' },
      { key: 'Occupation', label: 'পেশা', icon: '💼', span: 2 },
      { key: 'Notes', label: 'অন্যান্য তথ্য', icon: '📝', span: 2, type: 'textarea' }
    ];

    var currentProfile = {};

    /* ---------- Photo (INDEPENDENT of the header avatar — its own upload) ---------- */
    function renderProfilePhoto() {
      var wrap = document.getElementById('profilePhotoWrap');
      var fileId = currentProfile.PhotoFileID;
      var initial = (currentProfile.NameBn || currentProfile.NameEn || '?').trim().charAt(0);
      wrap.innerHTML = '';
      if (fileId) {
        var img = document.createElement('img');
        img.alt = 'Profile';
        img.src = 'https://drive.google.com/thumbnail?id=' + fileId + '&sz=w300';
        img.onerror = function () {
          wrap.innerHTML = '<div class="profile-photo-fallback">' + escapeHtml_(initial) + '</div>';
        };
        wrap.appendChild(img);
      } else {
        wrap.innerHTML = '<div class="profile-photo-fallback">' + escapeHtml_(initial) + '</div>';
      }
    }

    var profilePhotoInput = document.createElement('input');
    profilePhotoInput.type = 'file';
    profilePhotoInput.accept = 'image/*';
    profilePhotoInput.style.display = 'none';
    document.body.appendChild(profilePhotoInput);

    document.getElementById('btnChangeProfilePhotoPI').addEventListener('click', function () {
      profilePhotoInput.click();
    });

    profilePhotoInput.addEventListener('change', function () {
      var file = profilePhotoInput.files[0];
      if (!file) return;

      readFileAsBase64_(file, function (base64) {
        var token = getToken_();
        showToast('ছবি আপলোড হচ্ছে...', 'default');

        google.script.run
          .withSuccessHandler(function (fileId) {
            currentProfile.PhotoFileID = fileId;
            renderProfilePhoto();
            showToast('প্রোফাইল ছবি পরিবর্তন হয়েছে।', 'success');
          })
          .withFailureHandler(function (err) {
            showToast(err.message || 'ছবি আপলোড ব্যর্থ হয়েছে।', 'danger');
          })
          .uploadProfileMainPhoto(token, base64, file.type);
      }, function () {
        showToast('ছবিটি পড়া যায়নি।', 'danger');
      });
      profilePhotoInput.value = '';
    });

    /* ---------- Render view mode ---------- */
    function renderFieldRow(field, value) {
      var displayValue = value;
      if (field.type === 'date') displayValue = formatDateBn_(value);
      if (!displayValue) return '';
      return '' +
        '<div class="profile-field' + (field.span === 2 ? ' span-2' : '') + '">' +
          '<div class="profile-field-icon">' + field.icon + '</div>' +
          '<div>' +
            '<div class="profile-field-label">' + field.label + '</div>' +
            '<div class="profile-field-value">' + escapeHtml_(displayValue).replace(/\n/g, '<br>') + '</div>' +
          '</div>' +
        '</div>';
    }

    function renderProfileView(profile) {
      var mainHtml = MAIN_FIELDS.map(function (f) { return renderFieldRow(f, profile[f.key]); }).join('');
      var viewEl = document.getElementById('profileFieldsView');
      viewEl.innerHTML = mainHtml || '<div class="profile-empty">এখনো কোনো তথ্য যোগ করা হয়নি — "তথ্য সম্পাদনা করুন" চেপে শুরু করুন।</div>';

      var contactHtml = CONTACT_FIELDS.map(function (f) { return renderFieldRow(f, profile[f.key]); }).join('');
      var contactCard = document.getElementById('profileContactCard');
      if (contactHtml) {
        document.getElementById('profileContactView').innerHTML = contactHtml;
        contactCard.style.display = 'block';
      } else {
        contactCard.style.display = 'none';
      }
    }

    /* ---------- Edit mode (modal, reusing the global modal system) ---------- */
    function fieldInputHtml_(field, value) {
      var id = 'edit_' + field.key;
      if (field.type === 'select') {
        var opts = '<option value="">নির্বাচন করুন</option>' + field.options.map(function (o) {
          return '<option value="' + o + '"' + (value === o ? ' selected' : '') + '>' + o + '</option>';
        }).join('');
        return '<select class="form-input" id="' + id + '">' + opts + '</select>';
      }
      if (field.type === 'textarea') {
        return '<textarea class="form-input" id="' + id + '" rows="2">' + escapeHtml_(value) + '</textarea>';
      }
      if (field.type === 'date') {
        return '<input type="date" class="form-input" id="' + id + '" value="' + escapeHtml_(value) + '">';
      }
      return '<input type="text" class="form-input" id="' + id + '" value="' + escapeHtml_(value) + '">';
    }

    function openProfileEditModal() {
      var allFields = MAIN_FIELDS.concat(CONTACT_FIELDS);
      var bodyHtml = '<div class="form-grid">' + allFields.map(function (f) {
        return '<div class="form-row' + (f.span === 2 ? ' span-2' : '') + '">' +
          '<label>' + f.icon + ' ' + f.label + '</label>' +
          fieldInputHtml_(f, currentProfile[f.key] || '') +
          '</div>';
      }).join('') + '</div>';

      showModal('তথ্য সম্পাদনা করুন', bodyHtml, [
        { label: 'বাতিল', className: 'btn-outline', onClick: hideModal },
        { label: 'সংরক্ষণ করুন', className: 'btn-primary', onClick: submitProfileEdit }
      ]);
    }

    function submitProfileEdit() {
      var allFields = MAIN_FIELDS.concat(CONTACT_FIELDS);
      var changed = {};
      allFields.forEach(function (f) {
        var el = document.getElementById('edit_' + f.key);
        if (el) changed[f.key] = el.value;
      });

      var token = getToken_();
      google.script.run
        .withSuccessHandler(function () {
          Object.keys(changed).forEach(function (k) { currentProfile[k] = changed[k]; });
          hideModal();
          renderProfileView(currentProfile);
          showToast('প্রোফাইল তথ্য সংরক্ষণ হয়েছে।', 'success');
        })
        .withFailureHandler(function (err) {
          showToast(err.message || 'সংরক্ষণ ব্যর্থ হয়েছে।', 'danger');
        })
        .saveProfile(token, changed);
    }

    document.getElementById('btnEditProfile').addEventListener('click', openProfileEditModal);

    /* ---------- Education timeline (separate multi-entry section) ---------- */
    var currentEducation = [];
    var currentEducationDocs = {}; // eduId -> [{docId, fileId, fileName, uploadedAt}]
    var removedEduIds = [];
    var EDU_DOT_COLORS = ['#3B82F6', '#10B981', '#10B981', '#F59E0B'];
    var eduRowCounter = 0;
    var pendingUploadEduId = null;

    var eduDocFileInput = document.createElement('input');
    eduDocFileInput.type = 'file';
    eduDocFileInput.accept = '.pdf,.jpg,.jpeg,.png,.webp,application/pdf,image/*';
    eduDocFileInput.style.display = 'none';
    document.body.appendChild(eduDocFileInput);

    eduDocFileInput.addEventListener('change', function () {
      var file = eduDocFileInput.files[0];
      var eduId = pendingUploadEduId;
      pendingUploadEduId = null;
      if (!file || !eduId) return;

      readFileAsBase64_(file, function (base64) {
        var token = getToken_();
        showToast('কাগজপত্র আপলোড হচ্ছে...', 'default');

        google.script.run
          .withSuccessHandler(function (doc) {
            if (!currentEducationDocs[eduId]) currentEducationDocs[eduId] = [];
            currentEducationDocs[eduId].push(doc);
            renderEducationTimeline(currentEducation);
            showToast('কাগজপত্র আপলোড হয়েছে।', 'success');
          })
          .withFailureHandler(function (err) {
            showToast(err.message || 'আপলোড ব্যর্থ হয়েছে।', 'danger');
          })
          .uploadEducationDocument(token, eduId, base64, file.type, file.name);
      }, function () {
        showToast('ফাইলটি পড়া যায়নি।', 'danger');
      });
      eduDocFileInput.value = '';
    });

    function educationDocsHtml_(eduId) {
      var docs = currentEducationDocs[eduId] || [];
      var rows = docs.map(function (d) {
        return '<div class="education-doc-row" data-doc-id="' + escapeHtml_(d.docId) + '">' +
          '<span class="education-doc-icon">📄</span>' +
          '<span class="education-doc-name" title="' + escapeHtml_(d.fileName) + '">' + escapeHtml_(d.fileName) + '</span>' +
          '<a class="education-doc-download" href="https://drive.google.com/uc?export=download&id=' + encodeURIComponent(d.fileId) + '" target="_blank" rel="noopener">⬇ ডাউনলোড</a>' +
          '<button type="button" class="education-doc-remove" title="মুছুন">✕</button>' +
          '</div>';
      }).join('');

      return '<div class="education-docs">' +
        rows +
        '<button type="button" class="education-doc-add-btn" data-edu-id="' + escapeHtml_(eduId) + '">📎 কাগজপত্র যোগ করুন</button>' +
        '</div>';
    }

    function renderEducationTimeline(list) {
      var el = document.getElementById('educationTimeline');
      if (!list || !list.length) {
        el.innerHTML = '<div class="profile-empty">এখনো কোনো শিক্ষাগত তথ্য যোগ করা হয়নি।</div>';
        return;
      }
      el.innerHTML = list.map(function (item, i) {
        var metaParts = [];
        if (item.passingYear) metaParts.push('Passing Year: ' + item.passingYear);
        if (item.gradeValue) {
          metaParts.push((item.gradeType || 'গ্রেড') + ': ' + item.gradeValue + (item.gradeScale ? ' (out of ' + item.gradeScale + ')' : ''));
        }
        var color = EDU_DOT_COLORS[i % EDU_DOT_COLORS.length];
        return '<div class="education-item" style="--dot-color:' + color + '">' +
          '<div class="education-degree">' + escapeHtml_(item.degree) + '</div>' +
          (item.institution ? '<div class="education-institution">' + escapeHtml_(item.institution) + '</div>' : '') +
          (metaParts.length ? '<div class="education-meta">' + metaParts.map(function (p) { return escapeHtml_(p); }).join('&nbsp;&nbsp;|&nbsp;&nbsp;') + '</div>' : '') +
          educationDocsHtml_(item.id) +
          '</div>';
      }).join('');
    }

    function loadEducationDocs_(cb) {
      google.script.run
        .withSuccessHandler(function (map) {
          currentEducationDocs = map || {};
          if (cb) cb();
        })
        .withFailureHandler(function () {
          currentEducationDocs = {};
          if (cb) cb();
        })
        .getEducationDocumentsMap();
    }

    function loadEducation() {
      google.script.run
        .withSuccessHandler(function (list) {
          currentEducation = list || [];
          loadEducationDocs_(function () {
            renderEducationTimeline(currentEducation);
          });
        })
        .withFailureHandler(function () {
          document.getElementById('educationTimeline').innerHTML = '<div class="profile-empty">লোড করা যায়নি।</div>';
        })
        .getEducationList();
    }

    // One delegated click handler covers every "কাগজপত্র যোগ করুন" / "✕"
    // button across all (re-rendered) education items.
    document.getElementById('educationTimeline').addEventListener('click', function (e) {
      var addBtn = e.target.closest('.education-doc-add-btn');
      if (addBtn) {
        pendingUploadEduId = addBtn.getAttribute('data-edu-id');
        eduDocFileInput.click();
        return;
      }
      var removeBtn = e.target.closest('.education-doc-remove');
      if (removeBtn) {
        var row = removeBtn.closest('.education-doc-row');
        var docId = row.getAttribute('data-doc-id');
        var eduId = row.closest('.education-docs').querySelector('.education-doc-add-btn').getAttribute('data-edu-id');
        confirmDialog('এই কাগজপত্রটি মুছে ফেলতে চান?', function () {
          var token = getToken_();
          google.script.run
            .withSuccessHandler(function () {
              currentEducationDocs[eduId] = (currentEducationDocs[eduId] || []).filter(function (d) { return d.docId !== docId; });
              renderEducationTimeline(currentEducation);
              showToast('কাগজপত্র মুছে ফেলা হয়েছে।', 'success');
            })
            .withFailureHandler(function (err) {
              showToast(err.message || 'মুছে ফেলা যায়নি।', 'danger');
            })
            .deleteEducationDocument(token, docId);
        });
      }
    });

    /* ----- Education edit modal (add / edit / remove entries) ----- */
    function educationRowHtml_(r, idx) {
      var gradeTypeOptions = ['', 'CGPA', 'GPA', 'Division', 'অন্যান্য'].map(function (o) {
        return '<option value="' + o + '"' + ((r.gradeType || '') === o ? ' selected' : '') + '>' + (o || 'নির্বাচন করুন') + '</option>';
      }).join('');

      var docCount = (currentEducationDocs[r.id] || []).length;
      var removeHint = docCount
        ? '<div class="education-remove-hint">⚠️ এই এন্ট্রিতে ' + bnDigits_(docCount) + 'টি কাগজ সংযুক্ত আছে — এন্ট্রি মুছলে সেগুলোও ড্রাইভের ট্র্যাশে চলে যাবে।</div>'
        : '';

      return '' +
        '<div class="education-edit-row" id="eduRow_' + idx + '" data-edu-id="' + escapeHtml_(r.id || '') + '">' +
          '<div class="form-grid">' +
            '<div class="form-row span-2"><label>ডিগ্রি/পরীক্ষার নাম</label><input type="text" class="form-input" id="eduDegree_' + idx + '" value="' + escapeHtml_(r.degree) + '"></div>' +
            '<div class="form-row span-2"><label>প্রতিষ্ঠান</label><input type="text" class="form-input" id="eduInst_' + idx + '" value="' + escapeHtml_(r.institution) + '"></div>' +
            '<div class="form-row"><label>পাসের বছর</label><input type="text" class="form-input" id="eduYear_' + idx + '" value="' + escapeHtml_(r.passingYear) + '"></div>' +
            '<div class="form-row"><label>গ্রেড ধরন</label><select class="form-input" id="eduGType_' + idx + '">' + gradeTypeOptions + '</select></div>' +
            '<div class="form-row"><label>গ্রেড মান</label><input type="text" class="form-input" id="eduGVal_' + idx + '" value="' + escapeHtml_(r.gradeValue) + '"></div>' +
            '<div class="form-row"><label>স্কেল (out of)</label><input type="text" class="form-input" id="eduGScale_' + idx + '" value="' + escapeHtml_(r.gradeScale) + '"></div>' +
          '</div>' +
          removeHint +
          '<button type="button" class="btn btn-danger education-remove-btn" id="eduRemove_' + idx + '">🗑️ এই এন্ট্রি মুছুন</button>' +
          '<hr class="education-row-divider">' +
        '</div>';
    }

    function attachEduRemoveHandler_(idx) {
      var btn = document.getElementById('eduRemove_' + idx);
      if (btn) {
        btn.addEventListener('click', function () {
          var row = document.getElementById('eduRow_' + idx);
          if (row) {
            var eduId = row.getAttribute('data-edu-id');
            if (eduId) removedEduIds.push(eduId);
            row.remove();
          }
        });
      }
    }

    function openEducationEditModal() {
      eduRowCounter = 0;
      removedEduIds = [];
      var rows = currentEducation.length ? currentEducation.slice() : [{}];
      var bodyHtml = '<div id="eduRowsContainer">' +
        rows.map(function (r) { return educationRowHtml_(r, eduRowCounter++); }).join('') +
        '</div>' +
        '<button type="button" class="btn btn-outline" id="btnAddEduRow" style="margin-top:4px;">+ নতুন যোগ করুন</button>';

      showModal('শিক্ষাগত যোগ্যতা সম্পাদনা', bodyHtml, [
        { label: 'বাতিল', className: 'btn-outline', onClick: hideModal },
        { label: 'সংরক্ষণ করুন', className: 'btn-primary', onClick: submitEducationEdit }
      ]);

      rows.forEach(function (r, i) { attachEduRemoveHandler_(i); });

      document.getElementById('btnAddEduRow').addEventListener('click', function () {
        var container = document.getElementById('eduRowsContainer');
        var idx = eduRowCounter++;
        container.insertAdjacentHTML('beforeend', educationRowHtml_({}, idx));
        attachEduRemoveHandler_(idx);
      });
    }

    function submitEducationEdit() {
      var rowEls = document.querySelectorAll('#eduRowsContainer .education-edit-row');
      var entries = [];
      rowEls.forEach(function (rowEl) {
        var idx = rowEl.id.replace('eduRow_', '');
        entries.push({
          id: rowEl.getAttribute('data-edu-id') || '',
          degree: (document.getElementById('eduDegree_' + idx) || {}).value || '',
          institution: (document.getElementById('eduInst_' + idx) || {}).value || '',
          passingYear: (document.getElementById('eduYear_' + idx) || {}).value || '',
          gradeType: (document.getElementById('eduGType_' + idx) || {}).value || '',
          gradeValue: (document.getElementById('eduGVal_' + idx) || {}).value || '',
          gradeScale: (document.getElementById('eduGScale_' + idx) || {}).value || ''
        });
      });

      var token = getToken_();
      google.script.run
        .withSuccessHandler(function () {
          hideModal();
          loadEducation();
          showToast('শিক্ষাগত তথ্য সংরক্ষণ হয়েছে।', 'success');
        })
        .withFailureHandler(function (err) {
          showToast(err.message || 'সংরক্ষণ ব্যর্থ হয়েছে।', 'danger');
        })
        .setEducationList(token, entries, removedEduIds);
    }

    document.getElementById('btnEditEducation').addEventListener('click', openEducationEditModal);

    /* ---------- Age Calculator ---------- */
    var currentAgeCards = [];
    var ageTickTimer = null;

    function computeAgeParts_(dobDate, now) {
      var years = now.getFullYear() - dobDate.getFullYear();
      var months = now.getMonth() - dobDate.getMonth();
      var days = now.getDate() - dobDate.getDate();
      var hours = now.getHours() - dobDate.getHours();
      var minutes = now.getMinutes() - dobDate.getMinutes();
      var seconds = now.getSeconds() - dobDate.getSeconds();

      if (seconds < 0) { seconds += 60; minutes--; }
      if (minutes < 0) { minutes += 60; hours--; }
      if (hours < 0) { hours += 24; days--; }
      if (days < 0) {
        var prevMonthLastDay = new Date(now.getFullYear(), now.getMonth(), 0).getDate();
        days += prevMonthLastDay;
        months--;
      }
      if (months < 0) { months += 12; years--; }
      if (years < 0) { years = 0; months = 0; days = 0; hours = 0; minutes = 0; seconds = 0; }

      return { years: years, months: months, days: days, hours: hours, minutes: minutes, seconds: seconds };
    }

    function tickAgeCards_() {
      var now = new Date();
      document.querySelectorAll('#page-personal-info .age-card[data-dob]').forEach(function (card) {
        var dob = new Date(card.getAttribute('data-dob') + 'T00:00:00');
        if (isNaN(dob.getTime())) return;
        var p = computeAgeParts_(dob, now);
        var ageEl = card.querySelector('.age-card-age');
        var clockEl = card.querySelector('.age-card-clock');
        if (ageEl) {
          ageEl.textContent = bnDigits_(p.years) + ' বছর ' + bnDigits_(p.months) + ' মাস ' + bnDigits_(p.days) + ' দিন';
        }
        if (clockEl) {
          clockEl.textContent = bnDigits_(String(p.hours).padStart(2, '0')) + ':' +
            bnDigits_(String(p.minutes).padStart(2, '0')) + ':' +
            bnDigits_(String(p.seconds).padStart(2, '0'));
        }
      });
    }

    function renderAgeCards() {
      var grid = document.getElementById('ageCardsGrid');
      var html = currentAgeCards.map(function (card) {
        var initial = (card.name || '?').trim().charAt(0);
        var photoHtml = card.photoFileId
          ? '<img src="https://drive.google.com/thumbnail?id=' + encodeURIComponent(card.photoFileId) + '&sz=w200" alt="' + escapeHtml_(card.name) + '">'
          : escapeHtml_(initial);
        return '' +
          '<div class="age-card" data-card-id="' + escapeHtml_(card.id) + '" data-dob="' + escapeHtml_(card.dob) + '">' +
            '<button type="button" class="age-card-edit" title="সম্পাদনা" data-card-id="' + escapeHtml_(card.id) + '">✏️</button>' +
            '<div class="age-card-photo">' + photoHtml + '</div>' +
            '<div class="age-card-name">' + escapeHtml_(card.name) + '</div>' +
            '<div class="age-card-age"></div>' +
            '<div class="age-card-clock"></div>' +
          '</div>';
      }).join('');

      html += '' +
        '<div class="age-card-add" id="btnAddAgeCard">' +
          '<div class="plus">+</div>' +
          '<div>নতুন যোগ করুন</div>' +
        '</div>';

      grid.innerHTML = html;
      document.getElementById('btnAddAgeCard').addEventListener('click', openAddAgeCardModal);
      tickAgeCards_();
    }

    function loadAgeCards() {
      google.script.run
        .withSuccessHandler(function (list) {
          currentAgeCards = list || [];
          renderAgeCards();
        })
        .withFailureHandler(function () {
          document.getElementById('ageCardsGrid').innerHTML = '<div class="profile-empty">লোড করা যায়নি।</div>';
        })
        .getAgeCards();
    }

    var ageCardPendingPhoto = null; // { base64, mimeType } for the currently-open add/edit modal

    function ageModalPhotoRowHtml_(existingFileId, name) {
      var initial = (name || '?').trim().charAt(0);
      var preview = existingFileId
        ? '<img src="https://drive.google.com/thumbnail?id=' + encodeURIComponent(existingFileId) + '&sz=w150" alt="">'
        : escapeHtml_(initial);
      return '' +
        '<div class="age-modal-photo-row">' +
          '<div class="age-modal-photo-preview" id="ageModalPhotoPreview">' + preview + '</div>' +
          '<button type="button" class="btn btn-outline" id="ageModalPhotoBtn">📷 ছবি নির্বাচন করুন</button>' +
        '</div>';
    }

    function wireAgeModalPhotoPicker_(currentName) {
      ageCardPendingPhoto = null;
      var input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.style.display = 'none';
      document.body.appendChild(input);

      document.getElementById('ageModalPhotoBtn').addEventListener('click', function () { input.click(); });
      input.addEventListener('change', function () {
        var file = input.files[0];
        if (!file) return;
        readFileAsBase64_(file, function (base64) {
          ageCardPendingPhoto = { base64: base64, mimeType: file.type };
          document.getElementById('ageModalPhotoPreview').innerHTML =
            '<img src="' + ('data:' + file.type + ';base64,' + base64) + '" alt="">';
        }, function () {
          showToast('ছবিটি পড়া যায়নি।', 'danger');
        });
      });
    }

    function openAddAgeCardModal() {
      var bodyHtml = '' +
        ageModalPhotoRowHtml_('', '') +
        '<div class="form-row"><label>নাম</label><input type="text" class="form-input" id="ageAddName"></div>' +
        '<div class="form-row"><label>জন্ম তারিখ</label><input type="date" class="form-input" id="ageAddDob"></div>';

      showModal('নতুন এন্ট্রি যোগ করুন', bodyHtml, [
        { label: 'বাতিল', className: 'btn-outline', onClick: hideModal },
        { label: 'সংরক্ষণ করুন', className: 'btn-primary', onClick: submitAddAgeCard }
      ]);
      wireAgeModalPhotoPicker_('');
    }

    function submitAddAgeCard() {
      var name = document.getElementById('ageAddName').value.trim();
      var dob = document.getElementById('ageAddDob').value;
      if (!name) { showToast('নাম দিন।', 'warning'); return; }
      if (!dob) { showToast('জন্ম তারিখ দিন।', 'warning'); return; }

      var token = getToken_();
      google.script.run
        .withSuccessHandler(function (card) {
          currentAgeCards.unshift(card);
          hideModal();
          renderAgeCards();
          showToast('যোগ করা হয়েছে।', 'success');
        })
        .withFailureHandler(function (err) {
          showToast(err.message || 'সংরক্ষণ ব্যর্থ হয়েছে।', 'danger');
        })
        .addAgeCard(
          token, name, dob,
          ageCardPendingPhoto ? ageCardPendingPhoto.base64 : '',
          ageCardPendingPhoto ? ageCardPendingPhoto.mimeType : ''
        );
    }

    function openEditAgeCardModal(cardId) {
      var card = null;
      currentAgeCards.forEach(function (c) { if (c.id === cardId) card = c; });
      if (!card) return;

      var bodyHtml = '' +
        ageModalPhotoRowHtml_(card.photoFileId, card.name) +
        '<div class="form-row"><label>নাম</label><input type="text" class="form-input" id="ageEditName" value="' + escapeHtml_(card.name) + '"></div>' +
        '<div class="profile-photo-hint" style="text-align:left;">জন্ম তারিখ (' + formatDateBn_(card.dob) + ') পরিবর্তনযোগ্য নয় — ভুল থাকলে এন্ট্রিটি মুছে নতুন করে যোগ করুন।</div>';

      showModal('সম্পাদনা করুন', bodyHtml, [
        { label: 'মুছে ফেলুন', className: 'btn-danger', onClick: function () { confirmDeleteAgeCard_(cardId); } },
        { label: 'বাতিল', className: 'btn-outline', onClick: hideModal },
        { label: 'সংরক্ষণ করুন', className: 'btn-primary', onClick: function () { submitEditAgeCard(cardId); } }
      ]);
      wireAgeModalPhotoPicker_(card.name);
    }

    function submitEditAgeCard(cardId) {
      var name = document.getElementById('ageEditName').value.trim();
      if (!name) { showToast('নাম দিন।', 'warning'); return; }

      var token = getToken_();
      google.script.run
        .withSuccessHandler(function (updated) {
          currentAgeCards.forEach(function (c) {
            if (c.id === cardId) {
              c.name = updated.name;
              if (updated.photoFileId) c.photoFileId = updated.photoFileId;
            }
          });
          hideModal();
          renderAgeCards();
          showToast('পরিবর্তন সংরক্ষণ হয়েছে।', 'success');
        })
        .withFailureHandler(function (err) {
          showToast(err.message || 'সংরক্ষণ ব্যর্থ হয়েছে।', 'danger');
        })
        .updateAgeCard(
          token, cardId, name,
          ageCardPendingPhoto ? ageCardPendingPhoto.base64 : '',
          ageCardPendingPhoto ? ageCardPendingPhoto.mimeType : ''
        );
    }

    function confirmDeleteAgeCard_(cardId) {
      confirmDialog('এই এন্ট্রিটি মুছে ফেলতে চান?', function () {
        var token = getToken_();
        google.script.run
          .withSuccessHandler(function () {
            currentAgeCards = currentAgeCards.filter(function (c) { return c.id !== cardId; });
            hideModal();
            renderAgeCards();
            showToast('মুছে ফেলা হয়েছে।', 'success');
          })
          .withFailureHandler(function (err) {
            showToast(err.message || 'মুছে ফেলা যায়নি।', 'danger');
          })
          .deleteAgeCard(token, cardId);
      });
    }

    document.getElementById('ageCardsGrid').addEventListener('click', function (e) {
      var editBtn = e.target.closest('.age-card-edit');
      if (editBtn) {
        openEditAgeCardModal(editBtn.getAttribute('data-card-id'));
      }
    });

    // Live tick every second — years/months/days rarely change, but the
    // running clock is the whole point of "keep calculating".
    ageTickTimer = setInterval(tickAgeCards_, 1000);

    /* ---------- Initial load ---------- */
    function loadProfile() {
      google.script.run
        .withSuccessHandler(function (profile) {
          currentProfile = profile || {};
          renderProfileView(currentProfile);
          renderProfilePhoto();
        })
        .withFailureHandler(function () {
          document.getElementById('profileFieldsView').innerHTML =
            '<div class="profile-empty">তথ্য লোড করা যায়নি।</div>';
          renderProfilePhoto();
        })
        .getProfile();
    }

    loadProfile();
    loadEducation();
    loadAgeCards();

  })();
</script>
