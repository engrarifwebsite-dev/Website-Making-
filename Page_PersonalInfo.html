<section id="page-personal-info" class="page">

  <style>
    /* ---------- Education documents (certificates & other papers per qualification) ---------- */
    #page-personal-info .education-docs {
      margin-top: 12px;
      padding: 10px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    #page-personal-info .education-docs-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    #page-personal-info .education-docs-title {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text);
    }
    #page-personal-info .education-doc-add {
      background: none;
      border: 1px dashed var(--accent);
      color: var(--accent);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }
    #page-personal-info .education-doc-add:hover { background: var(--accent-soft); }

    #page-personal-info .education-doc-list { margin-top: 8px; display: flex; flex-direction: column; }
    #page-personal-info .education-doc-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-top: 1px solid var(--border);
    }
    #page-personal-info .education-doc-row:first-child { border-top: none; }
    #page-personal-info .education-doc-icon { font-size: 20px; flex-shrink: 0; }
    #page-personal-info .education-doc-info { flex: 1; min-width: 0; }
    #page-personal-info .education-doc-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #page-personal-info .education-doc-meta {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 3px;
    }
    #page-personal-info .education-doc-type {
      display: inline-block;
      padding: 1px 8px;
      margin-right: 8px;
      border-radius: 10px;
      background: var(--accent-soft);
      color: var(--navy);
      font-weight: 600;
    }
    #page-personal-info .education-doc-actions { display: flex; gap: 6px; flex-shrink: 0; }
    #page-personal-info .education-doc-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }
    #page-personal-info .education-doc-btn:hover { background: var(--bg); }
    #page-personal-info .education-doc-btn.danger { color: var(--danger); }
    #page-personal-info .education-doc-btn:disabled { opacity: 0.5; cursor: default; }
    #page-personal-info .education-docs-empty { font-size: 12px; color: var(--text-muted); margin-top: 8px; }
    #page-personal-info .education-remove-hint { font-size: 12px; color: var(--danger); margin: 6px 0 8px; }

    @media (max-width: 520px) {
      #page-personal-info .education-doc-row { flex-wrap: wrap; }
      #page-personal-info .education-doc-actions { width: 100%; justify-content: flex-end; }
    }
  </style>

  <div class="subtabs">
    <button class="subtab-btn active" data-subtab="profile">প্রোফাইল</button>
    <button class="subtab-btn" data-subtab="family-tree">ফ্যামিলি ট্রি</button>
  </div>

  <div class="subtab-panel active" id="subtab-profile">

    <div class="card profile-card">
      <div class="profile-card-header">
        <div>
          <h2 class="profile-card-title">ব্যক্তিগত তথ্য</h2>
          <p class="profile-card-subtitle">আপনার ব্যক্তিগত তথ্য ও প্রোফাইল তথ্যসমূহ এখানে দেখুন ও আপডেট করুন।</p>
        </div>
        <button type="button" class="btn btn-outline" id="btnEditProfile">✏️ তথ্য সম্পাদনা করুন</button>
      </div>

      <div class="profile-card-body">
        <div class="profile-photo-col">
          <div class="profile-photo-wrap" id="profilePhotoWrap">
            <div class="profile-photo-fallback" id="profilePhotoFallback">?</div>
          </div>
          <button type="button" class="btn btn-outline profile-photo-btn" id="btnChangeProfilePhotoPI">📷 ছবি পরিবর্তন করুন</button>
          <div class="profile-photo-hint">JPG, PNG (Max 2MB)</div>
        </div>

        <div class="profile-fields-col" id="profileFieldsView">
          <div class="profile-empty">লোড হচ্ছে...</div>
        </div>
      </div>
    </div>

    <div class="card profile-contact-card" id="profileContactCard" style="display:none;">
      <div class="home-card-title">যোগাযোগ ও অন্যান্য তথ্য</div>
      <div class="profile-fields-col" id="profileContactView"></div>
    </div>

    <div class="card education-card">
      <div class="education-card-header">
        <div class="education-card-title">🎓 শিক্ষাগত যোগ্যতা</div>
        <button type="button" class="education-edit-link" id="btnEditEducation">সম্পাদনা</button>
      </div>
      <div class="education-timeline" id="educationTimeline">
        <div class="profile-empty">লোড হচ্ছে...</div>
      </div>
    </div>

  </div>

  <div class="subtab-panel" id="subtab-family-tree">
    <div class="page-placeholder">
      <h2>ফ্যামিলি ট্রি</h2>
      <p>এই সেকশনের কন্টেন্ট পরবর্তী ধাপে যুক্ত হবে।</p>
    </div>
  </div>

</section>

<script>
  (function () {
    if (window.__personalInfoInit) return;
    window.__personalInfoInit = true;

    var TOKEN_KEY = 'personalAppSessionToken';

    var BN_DIGITS = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
    function bnDigits_(v) {
      return String(v).replace(/[0-9]/g, function (d) { return BN_DIGITS[Number(d)]; });
    }

    var BN_MONTHS = ['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
    function formatDateBn_(isoStr) {
      if (!isoStr) return '';
      var d = new Date(isoStr);
      if (isNaN(d.getTime())) return isoStr;
      return bnDigits_(d.getDate()) + ' ' + BN_MONTHS[d.getMonth()] + ' ' + bnDigits_(d.getFullYear());
    }

    function escapeHtml_(str) {
      return String(str || '').replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    /* ---------- Field definitions ---------- */
    var MAIN_FIELDS = [
      { key: 'NameBn', label: 'নাম (বাংলা)', icon: '👤', span: 2 },
      { key: 'NameEn', label: 'নাম (English)', icon: '🌐', span: 2 },
      { key: 'Father', label: 'পিতা', icon: '👨', span: 2 },
      { key: 'Mother', label: 'মাতা', icon: '👩', span: 2 },
      { key: 'DOB', label: 'জন্ম তারিখ', icon: '🎂', span: 1, type: 'date' },
      { key: 'Nationality', label: 'জাতীয়তা', icon: '🌍', span: 1 },
      { key: 'BloodGroup', label: 'রক্তের গ্রুপ', icon: '🩸', span: 1, type: 'select',
        options: ['A+','A-','B+','B-','AB+','AB-','O+','O-'] },
      { key: 'Religion', label: 'ধর্ম', icon: '🕌', span: 1 },
      { key: 'MaritalStatus', label: 'বৈবাহিক অবস্থা', icon: '💍', span: 2, type: 'select',
        options: ['অবিবাহিত','বিবাহিত','বিধবা/বিপত্নীক','তালাকপ্রাপ্ত'] },
      { key: 'Spouse', label: 'স্ত্রী/স্বামী', icon: '💑', span: 2 },
      { key: 'Children', label: 'সন্তান', icon: '👶', span: 2 }
    ];

    var CONTACT_FIELDS = [
      { key: 'Phone', label: 'ফোন', icon: '📞', span: 1 },
      { key: 'Email', label: 'ইমেইল', icon: '✉️', span: 1 },
      { key: 'PermanentAddress', label: 'স্থায়ী ঠিকানা', icon: '🏠', span: 2, type: 'textarea' },
      { key: 'CurrentAddress', label: 'বর্তমান ঠিকানা', icon: '📍', span: 2, type: 'textarea' },
      { key: 'Occupation', label: 'পেশা', icon: '💼', span: 2 },
      { key: 'Notes', label: 'অন্যান্য তথ্য', icon: '📝', span: 2, type: 'textarea' }
    ];

    var currentProfile = {};

    /* ---------- Photo (INDEPENDENT of the header avatar — its own upload) ---------- */
    function renderProfilePhoto() {
      var wrap = document.getElementById('profilePhotoWrap');
      var fileId = currentProfile.PhotoFileID;
      var initial = (currentProfile.NameBn || currentProfile.NameEn || '?').trim().charAt(0);
      wrap.innerHTML = '';
      if (fileId) {
        var img = document.createElement('img');
        img.alt = 'Profile';
        img.src = 'https://drive.google.com/thumbnail?id=' + fileId + '&sz=w300';
        img.onerror = function () {
          wrap.innerHTML = '<div class="profile-photo-fallback">' + escapeHtml_(initial) + '</div>';
        };
        wrap.appendChild(img);
      } else {
        wrap.innerHTML = '<div class="profile-photo-fallback">' + escapeHtml_(initial) + '</div>';
      }
    }

    var profilePhotoInput = document.createElement('input');
    profilePhotoInput.type = 'file';
    profilePhotoInput.accept = 'image/*';
    profilePhotoInput.style.display = 'none';
    document.body.appendChild(profilePhotoInput);

    document.getElementById('btnChangeProfilePhotoPI').addEventListener('click', function () {
      profilePhotoInput.click();
    });

    profilePhotoInput.addEventListener('change', function () {
      var file = profilePhotoInput.files[0];
      if (!file) return;

      var reader = new FileReader();
      reader.onload = function () {
        var base64 = reader.result.split(',')[1];
        var token = localStorage.getItem(TOKEN_KEY);
        showToast('ছবি আপলোড হচ্ছে...', 'default');

        google.script.run
          .withSuccessHandler(function (fileId) {
            currentProfile.PhotoFileID = fileId;
            renderProfilePhoto();
            showToast('প্রোফাইল ছবি পরিবর্তন হয়েছে।', 'success');
          })
          .withFailureHandler(function (err) {
            showToast(err.message || 'ছবি আপলোড ব্যর্থ হয়েছে।', 'danger');
          })
          .uploadProfileMainPhoto(token, base64, file.type);
      };
      reader.readAsDataURL(file);
      profilePhotoInput.value = '';
    });

    /* ---------- Render view mode ---------- */
    function renderFieldRow(field, value) {
      var displayValue = value;
      if (field.type === 'date') displayValue = formatDateBn_(value);
      if (!displayValue) return '';
      return '' +
        '<div class="profile-field' + (field.span === 2 ? ' span-2' : '') + '">' +
          '<div class="profile-field-icon">' + field.icon + '</div>' +
          '<div>' +
            '<div class="profile-field-label">' + field.label + '</div>' +
            '<div class="profile-field-value">' + escapeHtml_(displayValue).replace(/\n/g, '<br>') + '</div>' +
          '</div>' +
        '</div>';
    }

    function renderProfileView(profile) {
      var mainHtml = MAIN_FIELDS.map(function (f) { return renderFieldRow(f, profile[f.key]); }).join('');
      var viewEl = document.getElementById('profileFieldsView');
      viewEl.innerHTML = mainHtml || '<div class="profile-empty">এখনো কোনো তথ্য যোগ করা হয়নি — "তথ্য সম্পাদনা করুন" চেপে শুরু করুন।</div>';

      var contactHtml = CONTACT_FIELDS.map(function (f) { return renderFieldRow(f, profile[f.key]); }).join('');
      var contactCard = document.getElementById('profileContactCard');
      if (contactHtml) {
        document.getElementById('profileContactView').innerHTML = contactHtml;
        contactCard.style.display = 'block';
      } else {
        contactCard.style.display = 'none';
      }
    }

    /* ---------- Edit mode (modal, reusing the global modal system) ---------- */
    function fieldInputHtml_(field, value) {
      var id = 'edit_' + field.key;
      if (field.type === 'select') {
        var opts = '<option value="">নির্বাচন করুন</option>' + field.options.map(function (o) {
          return '<option value="' + o + '"' + (value === o ? ' selected' : '') + '>' + o + '</option>';
        }).join('');
        return '<select class="form-input" id="' + id + '">' + opts + '</select>';
      }
      if (field.type === 'textarea') {
        return '<textarea class="form-input" id="' + id + '" rows="2">' + escapeHtml_(value) + '</textarea>';
      }
      if (field.type === 'date') {
        return '<input type="date" class="form-input" id="' + id + '" value="' + escapeHtml_(value) + '">';
      }
      return '<input type="text" class="form-input" id="' + id + '" value="' + escapeHtml_(value) + '">';
    }

    function openProfileEditModal() {
      var allFields = MAIN_FIELDS.concat(CONTACT_FIELDS);
      var bodyHtml = '<div class="form-grid">' + allFields.map(function (f) {
        return '<div class="form-row' + (f.span === 2 ? ' span-2' : '') + '">' +
          '<label>' + f.icon + ' ' + f.label + '</label>' +
          fieldInputHtml_(f, currentProfile[f.key] || '') +
          '</div>';
      }).join('') + '</div>';

      showModal('তথ্য সম্পাদনা করুন', bodyHtml, [
        { label: 'বাতিল', className: 'btn-outline', onClick: hideModal },
        { label: 'সংরক্ষণ করুন', className: 'btn-primary', onClick: submitProfileEdit }
      ]);
    }

    function submitProfileEdit() {
      var allFields = MAIN_FIELDS.concat(CONTACT_FIELDS);
      var changed = {};
      allFields.forEach(function (f) {
        var el = document.getElementById('edit_' + f.key);
        if (el) changed[f.key] = el.value;
      });

      var token = localStorage.getItem(TOKEN_KEY);
      google.script.run
        .withSuccessHandler(function () {
          Object.keys(changed).forEach(function (k) { currentProfile[k] = changed[k]; });
          hideModal();
          renderProfileView(currentProfile);
          showToast('প্রোফাইল তথ্য সংরক্ষণ হয়েছে।', 'success');
        })
        .withFailureHandler(function (err) {
          showToast(err.message || 'সংরক্ষণ ব্যর্থ হয়েছে।', 'danger');
        })
        .saveProfile(token, changed);
    }

    document.getElementById('btnEditProfile').addEventListener('click', openProfileEditModal);

    /* ---------- Education timeline (separate multi-entry section) ---------- */
    var currentEducation = [];
    var educationLoaded = false;
    var EDU_DOT_COLORS = ['#3B82F6', '#10B981', '#10B981', '#F59E0B'];
    var eduRowCounter = 0;

    /* ---------- Education documents (certificates & other papers) ---------- */
    var currentEducationDocs = [];
    var educationDocsState = 'loading'; // 'loading' | 'ready' | 'error'
    var educationDocBusy = false;       // true while an upload batch is running
    var educationDownloading = {};      // docId -> true while a download is being prepared

    var EDU_DOC_TYPES = ['সার্টিফিকেট', 'মার্কশিট / ট্রান্সক্রিপ্ট', 'প্রবেশপত্র (অ্যাডমিট কার্ড)', 'প্রশংসাপত্র / টেস্টিমোনিয়াল', 'অন্যান্য'];
    var EDU_DOC_MAX_BYTES = 10 * 1024 * 1024; // 10 MB per file
    var EDU_DOC_MIME_BY_EXT = {
      pdf: 'application/pdf',
      jpg: 'image/jpeg',
      jpeg: 'image/jpeg',
      png: 'image/png',
      webp: 'image/webp',
      doc: 'application/msword',
      docx: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
    };

    function fileExt_(name) {
      var m = /\.([^.]+)$/.exec(String(name || ''));
      return m ? m[1].toLowerCase() : '';
    }

    function docIcon_(mime) {
      mime = String(mime || '');
      if (mime === 'application/pdf') return '📄';
      if (mime.indexOf('image/') === 0) return '🖼️';
      return '📝';
    }

    function formatFileSize_(bytes) {
      bytes = Number(bytes) || 0;
      if (bytes >= 1048576) return bnDigits_((bytes / 1048576).toFixed(1)) + ' MB';
      if (bytes >= 1024) return bnDigits_(Math.round(bytes / 1024)) + ' KB';
      return bnDigits_(bytes) + ' B';
    }

    function docsFor_(eduId) {
      eduId = String(eduId || '');
      return currentEducationDocs.filter(function (d) { return String(d.educationId) === eduId; });
    }

    function findDoc_(docId) {
      for (var i = 0; i < currentEducationDocs.length; i++) {
        if (currentEducationDocs[i].docId === docId) return currentEducationDocs[i];
      }
      return null;
    }

    function docRowHtml_(d) {
      var metaParts = [];
      if (d.size) metaParts.push(formatFileSize_(d.size));
      if (d.uploadedAt) metaParts.push(formatDateBn_(d.uploadedAt));

      return '' +
        '<div class="education-doc-row">' +
          '<div class="education-doc-icon">' + docIcon_(d.mimeType) + '</div>' +
          '<div class="education-doc-info">' +
            '<div class="education-doc-name" title="' + escapeHtml_(d.fileName) + '">' + escapeHtml_(d.fileName) + '</div>' +
            '<div class="education-doc-meta">' +
              '<span class="education-doc-type">' + escapeHtml_(d.docType) + '</span>' +
              metaParts.map(function (p) { return escapeHtml_(p); }).join('&nbsp;&nbsp;|&nbsp;&nbsp;') +
            '</div>' +
          '</div>' +
          '<div class="education-doc-actions">' +
            '<button type="button" class="education-doc-btn" data-action="download-doc" data-doc-id="' + escapeHtml_(d.docId) + '">⬇️ ডাউনলোড</button>' +
            '<button type="button" class="education-doc-btn danger" data-action="delete-doc" data-doc-id="' + escapeHtml_(d.docId) + '" title="মুছুন" aria-label="মুছুন">🗑️</button>' +
          '</div>' +
        '</div>';
    }

    function educationDocsHtml_(item) {
      var eduId = String(item.id || '');
      var docs = docsFor_(eduId);
      var head, body;

      if (educationDocsState === 'ready') {
        head = '<div class="education-docs-head">' +
          '<span class="education-docs-title">📎 কাগজপত্র (' + bnDigits_(docs.length) + ')</span>' +
          '<button type="button" class="education-doc-add" data-action="add-doc" data-edu-id="' + escapeHtml_(eduId) + '">+ কাগজ যোগ করুন</button>' +
          '</div>';
        body = docs.length
          ? '<div class="education-doc-list">' + docs.map(docRowHtml_).join('') + '</div>'
          : '<div class="education-docs-empty">এখনো কোনো কাগজ আপলোড করা হয়নি।</div>';
      } else if (educationDocsState === 'error') {
        head = '<div class="education-docs-head"><span class="education-docs-title">📎 কাগজপত্র</span></div>';
        body = '<div class="education-docs-empty">কাগজপত্রের তালিকা লোড করা যায়নি। ' +
          '<button type="button" class="education-doc-btn" data-action="reload-docs">আবার চেষ্টা করুন</button></div>';
      } else {
        head = '<div class="education-docs-head"><span class="education-docs-title">📎 কাগজপত্র</span></div>';
        body = '<div class="education-docs-empty">লোড হচ্ছে...</div>';
      }

      return '<div class="education-docs">' + head + body + '</div>';
    }

    function renderEducationTimeline(list) {
      var el = document.getElementById('educationTimeline');
      if (!list || !list.length) {
        el.innerHTML = '<div class="profile-empty">এখনো কোনো শিক্ষাগত তথ্য যোগ করা হয়নি।</div>';
        return;
      }
      el.innerHTML = list.map(function (item, i) {
        var metaParts = [];
        if (item.passingYear) metaParts.push('Passing Year: ' + item.passingYear);
        if (item.gradeValue) {
          metaParts.push((item.gradeType || 'গ্রেড') + ': ' + item.gradeValue + (item.gradeScale ? ' (out of ' + item.gradeScale + ')' : ''));
        }
        var color = EDU_DOT_COLORS[i % EDU_DOT_COLORS.length];
        return '<div class="education-item" style="--dot-color:' + color + '">' +
          '<div class="education-degree">' + escapeHtml_(item.degree) + '</div>' +
          (item.institution ? '<div class="education-institution">' + escapeHtml_(item.institution) + '</div>' : '') +
          (metaParts.length ? '<div class="education-meta">' + metaParts.map(function (p) { return escapeHtml_(p); }).join('&nbsp;&nbsp;|&nbsp;&nbsp;') + '</div>' : '') +
          educationDocsHtml_(item) +
          '</div>';
      }).join('');
    }

    function loadEducation() {
      google.script.run
        .withSuccessHandler(function (list) {
          currentEducation = list || [];
          educationLoaded = true;
          renderEducationTimeline(currentEducation);
        })
        .withFailureHandler(function () {
          document.getElementById('educationTimeline').innerHTML = '<div class="profile-empty">লোড করা যায়নি।</div>';
        })
        .getEducationList();
    }

    function loadEducationDocs() {
      if (educationDocsState !== 'ready') {
        educationDocsState = 'loading';
        if (educationLoaded) renderEducationTimeline(currentEducation);
      }
      google.script.run
        .withSuccessHandler(function (list) {
          currentEducationDocs = list || [];
          educationDocsState = 'ready';
          if (educationLoaded) renderEducationTimeline(currentEducation);
        })
        .withFailureHandler(function () {
          educationDocsState = 'error';
          if (educationLoaded) renderEducationTimeline(currentEducation);
        })
        .getEducationDocuments();
    }

    /* ----- Upload ----- */
    function openEducationDocUploadModal_(eduId) {
      var edu = null;
      currentEducation.forEach(function (x) { if (String(x.id) === String(eduId)) edu = x; });
      if (!edu) return;

      var typeOptions = EDU_DOC_TYPES.map(function (t) {
        return '<option value="' + escapeHtml_(t) + '">' + escapeHtml_(t) + '</option>';
      }).join('');

      var bodyHtml =
        '<div class="form-row"><label>কাগজের ধরন</label>' +
          '<select class="form-input" id="eduDocType">' + typeOptions + '</select></div>' +
        '<div class="form-row"><label>ফাইল নির্বাচন করুন (একসাথে একাধিক ফাইল দেওয়া যাবে)</label>' +
          '<input type="file" class="form-input" id="eduDocFiles" multiple accept=".pdf,.jpg,.jpeg,.png,.webp,.doc,.docx"></div>' +
        '<div class="profile-photo-hint" style="text-align:left;">PDF, JPG, PNG, WEBP, DOC, DOCX — প্রতিটি ফাইল সর্বোচ্চ ১০ MB</div>';

      showModal('কাগজ যোগ করুন — ' + edu.degree, bodyHtml, [
        { label: 'বাতিল', className: 'btn-outline', onClick: hideModal },
        { label: 'আপলোড করুন', className: 'btn-primary', onClick: function () { submitEducationDocUpload_(eduId); } }
      ]);
    }

    function submitEducationDocUpload_(eduId) {
      var input = document.getElementById('eduDocFiles');
      var docType = document.getElementById('eduDocType').value;
      var files = input && input.files ? Array.prototype.slice.call(input.files) : [];

      if (!files.length) {
        showToast('অন্তত একটি ফাইল নির্বাচন করুন।', 'warning');
        return;
      }
      for (var i = 0; i < files.length; i++) {
        var f = files[i];
        if (!EDU_DOC_MIME_BY_EXT[fileExt_(f.name)]) {
          showToast('"' + f.name + '" — এই ধরনের ফাইল আপলোড করা যাবে না।', 'warning');
          return;
        }
        if (!f.size) {
          showToast('"' + f.name + '" ফাইলটি খালি।', 'warning');
          return;
        }
        if (f.size > EDU_DOC_MAX_BYTES) {
          showToast('"' + f.name + '" — ফাইলের সাইজ ১০ MB-এর বেশি।', 'warning');
          return;
        }
      }

      hideModal();
      uploadEducationDocs_(eduId, docType, files);
    }

    function readFileAsBase64_(file, onDone, onError) {
      var reader = new FileReader();
      reader.onload = function () { onDone(String(reader.result).split(',')[1] || ''); };
      reader.onerror = onError;
      reader.readAsDataURL(file);
    }

    function uploadEducationDocs_(eduId, docType, files) {
      if (educationDocBusy) {
        showToast('আরেকটি আপলোড চলছে, একটু অপেক্ষা করুন।', 'warning');
        return;
      }
      educationDocBusy = true;

      var total = files.length;
      var done = 0;
      var failed = 0;
      var token = localStorage.getItem(TOKEN_KEY);

      function finish() {
        educationDocBusy = false;
        if (done > 0) {
          showToast(bnDigits_(done) + 'টি কাগজ আপলোড হয়েছে।' + (failed ? ' ' + bnDigits_(failed) + 'টি ব্যর্থ হয়েছে।' : ''), failed ? 'warning' : 'success');
        }
      }

      function next() {
        if (!files.length) { finish(); return; }
        var file = files.shift();
        showToast('আপলোড হচ্ছে (' + bnDigits_(done + failed + 1) + '/' + bnDigits_(total) + '): ' + file.name, 'default');

        readFileAsBase64_(file, function (base64) {
          google.script.run
            .withSuccessHandler(function (doc) {
              done++;
              currentEducationDocs.push(doc);
              renderEducationTimeline(currentEducation);
              next();
            })
            .withFailureHandler(function (err) {
              failed++;
              showToast('"' + file.name + '": ' + ((err && err.message) || 'আপলোড ব্যর্থ হয়েছে।'), 'danger');
              next();
            })
            .uploadEducationDocument(token, eduId, docType, file.name, base64, EDU_DOC_MIME_BY_EXT[fileExt_(file.name)]);
        }, function () {
          failed++;
          showToast('"' + file.name + '" ফাইলটি পড়া যায়নি।', 'danger');
          next();
        });
      }

      next();
    }

    /* ----- Download ----- */
    function saveBase64AsFile_(base64, mimeType, fileName) {
      var bin = atob(base64);
      var bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);

      var blob = new Blob([bytes], { type: mimeType || 'application/octet-stream' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = fileName || 'document';
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      setTimeout(function () {
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 1500);
    }

    function downloadEducationDoc_(docId, btn) {
      if (educationDownloading[docId]) return;
      educationDownloading[docId] = true;
      if (btn) btn.disabled = true;
      showToast('ডাউনলোড প্রস্তুত হচ্ছে...', 'default');

      var token = localStorage.getItem(TOKEN_KEY);
      google.script.run
        .withSuccessHandler(function (res) {
          educationDownloading[docId] = false;
          if (btn) btn.disabled = false;
          try {
            saveBase64AsFile_(res.base64, res.mimeType, res.fileName);
            showToast('ডাউনলোড শুরু হয়েছে।', 'success');
          } catch (e) {
            showToast('ডাউনলোড করা যায়নি।', 'danger');
          }
        })
        .withFailureHandler(function (err) {
          educationDownloading[docId] = false;
          if (btn) btn.disabled = false;
          showToast((err && err.message) || 'ডাউনলোড ব্যর্থ হয়েছে।', 'danger');
        })
        .getEducationDocumentData(token, docId);
    }

    /* ----- Delete ----- */
    function confirmDeleteEducationDoc_(docId) {
      var doc = findDoc_(docId);
      if (!doc) return;

      confirmDialog('"' + escapeHtml_(doc.fileName) + '" কাগজটি মুছে ফেলবেন? ফাইলটি ড্রাইভের ট্র্যাশে চলে যাবে।', function () {
        var token = localStorage.getItem(TOKEN_KEY);
        google.script.run
          .withSuccessHandler(function () {
            currentEducationDocs = currentEducationDocs.filter(function (d) { return d.docId !== docId; });
            renderEducationTimeline(currentEducation);
            showToast('কাগজ মুছে ফেলা হয়েছে।', 'success');
          })
          .withFailureHandler(function (err) {
            showToast((err && err.message) || 'মুছে ফেলা যায়নি।', 'danger');
          })
          .deleteEducationDocument(token, docId);
      });
    }

    /* ----- One click handler for every button inside the timeline ----- */
    document.getElementById('educationTimeline').addEventListener('click', function (e) {
      var btn = e.target.closest('[data-action]');
      if (!btn) return;
      var action = btn.getAttribute('data-action');

      if (action === 'add-doc') {
        openEducationDocUploadModal_(btn.getAttribute('data-edu-id'));
      } else if (action === 'download-doc') {
        downloadEducationDoc_(btn.getAttribute('data-doc-id'), btn);
      } else if (action === 'delete-doc') {
        confirmDeleteEducationDoc_(btn.getAttribute('data-doc-id'));
      } else if (action === 'reload-docs') {
        loadEducationDocs();
      }
    });

    /* ----- Education edit modal ----- */
    function educationRowHtml_(r, idx) {
      var gradeTypeOptions = ['', 'CGPA', 'GPA', 'Division', 'অন্যান্য'].map(function (o) {
        return '<option value="' + o + '"' + ((r.gradeType || '') === o ? ' selected' : '') + '>' + (o || 'নির্বাচন করুন') + '</option>';
      }).join('');

      var docCount = r.id ? docsFor_(r.id).length : 0;
      var removeHint = docCount
        ? '<div class="education-remove-hint">⚠️ এই এন্ট্রিতে ' + bnDigits_(docCount) + 'টি কাগজ সংযুক্ত আছে — এন্ট্রি মুছলে সেগুলোও ড্রাইভের ট্র্যাশে চলে যাবে।</div>'
        : '';

      return '' +
        '<div class="education-edit-row" id="eduRow_' + idx + '" data-edu-id="' + escapeHtml_(r.id || '') + '">' +
          '<div class="form-grid">' +
            '<div class="form-row span-2"><label>ডিগ্রি/পরীক্ষার নাম</label><input type="text" class="form-input" id="eduDegree_' + idx + '" value="' + escapeHtml_(r.degree) + '"></div>' +
            '<div class="form-row span-2"><label>প্রতিষ্ঠান</label><input type="text" class="form-input" id="eduInst_' + idx + '" value="' + escapeHtml_(r.institution) + '"></div>' +
            '<div class="form-row"><label>পাসের বছর</label><input type="text" class="form-input" id="eduYear_' + idx + '" value="' + escapeHtml_(r.passingYear) + '"></div>' +
            '<div class="form-row"><label>গ্রেড ধরন</label><select class="form-input" id="eduGType_' + idx + '">' + gradeTypeOptions + '</select></div>' +
            '<div class="form-row"><label>গ্রেড মান</label><input type="text" class="form-input" id="eduGVal_' + idx + '" value="' + escapeHtml_(r.gradeValue) + '"></div>' +
            '<div class="form-row"><label>স্কেল (out of)</label><input type="text" class="form-input" id="eduGScale_' + idx + '" value="' + escapeHtml_(r.gradeScale) + '"></div>' +
          '</div>' +
          removeHint +
          '<button type="button" class="btn btn-danger education-remove-btn" id="eduRemove_' + idx + '">🗑️ এই এন্ট্রি মুছুন</button>' +
          '<hr class="education-row-divider">' +
        '</div>';
    }

    function attachEduRemoveHandler_(idx) {
      var btn = document.getElementById('eduRemove_' + idx);
      if (btn) {
        btn.addEventListener('click', function () {
          var row = document.getElementById('eduRow_' + idx);
          if (row) row.remove();
        });
      }
    }

    function openEducationEditModal() {
      eduRowCounter = 0;
      var rows = currentEducation.length ? currentEducation.slice() : [{}];
      var bodyHtml = '<div id="eduRowsContainer">' +
        rows.map(function (r) { return educationRowHtml_(r, eduRowCounter++); }).join('') +
        '</div>' +
        '<button type="button" class="btn btn-outline" id="btnAddEduRow" style="margin-top:4px;">+ নতুন যোগ করুন</button>';

      showModal('শিক্ষাগত যোগ্যতা সম্পাদনা', bodyHtml, [
        { label: 'বাতিল', className: 'btn-outline', onClick: hideModal },
        { label: 'সংরক্ষণ করুন', className: 'btn-primary', onClick: submitEducationEdit }
      ]);

      rows.forEach(function (r, i) { attachEduRemoveHandler_(i); });

      document.getElementById('btnAddEduRow').addEventListener('click', function () {
        var container = document.getElementById('eduRowsContainer');
        var idx = eduRowCounter++;
        container.insertAdjacentHTML('beforeend', educationRowHtml_({}, idx));
        attachEduRemoveHandler_(idx);
      });
    }

    function submitEducationEdit() {
      var rowEls = document.querySelectorAll('#eduRowsContainer .education-edit-row');
      var entries = [];
      rowEls.forEach(function (rowEl) {
        var idx = rowEl.id.replace('eduRow_', '');
        entries.push({
          id: rowEl.getAttribute('data-edu-id') || '',
          degree: (document.getElementById('eduDegree_' + idx) || {}).value || '',
          institution: (document.getElementById('eduInst_' + idx) || {}).value || '',
          passingYear: (document.getElementById('eduYear_' + idx) || {}).value || '',
          gradeType: (document.getElementById('eduGType_' + idx) || {}).value || '',
          gradeValue: (document.getElementById('eduGVal_' + idx) || {}).value || '',
          gradeScale: (document.getElementById('eduGScale_' + idx) || {}).value || ''
        });
      });

      var token = localStorage.getItem(TOKEN_KEY);
      google.script.run
        .withSuccessHandler(function () {
          hideModal();
          loadEducation();
          loadEducationDocs();
          showToast('শিক্ষাগত তথ্য সংরক্ষণ হয়েছে।', 'success');
        })
        .withFailureHandler(function (err) {
          showToast(err.message || 'সংরক্ষণ ব্যর্থ হয়েছে।', 'danger');
        })
        .setEducationList(token, entries);
    }

    document.getElementById('btnEditEducation').addEventListener('click', openEducationEditModal);

    /* ---------- Initial load ---------- */
    function loadProfile() {
      google.script.run
        .withSuccessHandler(function (profile) {
          currentProfile = profile || {};
          renderProfileView(currentProfile);
          renderProfilePhoto();
        })
        .withFailureHandler(function () {
          document.getElementById('profileFieldsView').innerHTML =
            '<div class="profile-empty">তথ্য লোড করা যায়নি।</div>';
          renderProfilePhoto();
        })
        .getProfile();
    }

    loadProfile();
    loadEducation();
    loadEducationDocs();

  })();
</script>
