<!--
  Partial_Footer.html
  গ্লোবাল ফুটার (প্রতিটি পেজে একই): আজকের তারিখ, বর্তমান সময় ও আবহাওয়া।
  আগের হাদিস-ফুটারের জায়গায় বসেছে। সব ক্লাস/আইডি ib- দিয়ে শুরু, তাই
  অন্য পেজের সাথে সংঘর্ষ নেই। স্টাইল ও স্ক্রিপ্ট এই ফাইলের ভেতরেই আছে।
  ডেটা: getHomeConfig() (Server_Home.gs — লোকেশন), Aladhan (হিজরি তারিখ),
  Open-Meteo (আবহাওয়া); ঘড়ি ও বাংলা/ইংরেজি তারিখ ব্রাউজারে হিসাব হয়।
-->
<style>
  .ib-footer { padding: 8px 24px 20px; }

  .ib-bar {
    display: grid;
    grid-template-columns: 1fr 1fr 1.7fr;
    background: #071a33;
    color: #ffffff;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(7, 26, 51, .18);
    overflow: hidden;
  }

  .ib-sec {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 22px;
    min-width: 0;
  }
  .ib-sec + .ib-sec { border-left: 1px solid rgba(255, 255, 255, .12); }

  .ib-icon-box {
    width: 52px; height: 52px;
    flex-shrink: 0;
    display: grid; place-items: center;
    border-radius: 14px;
    background: #0e2a52;
    border: 1px solid #1f4479;
    color: #cfe0ff;
  }
  .ib-icon-plain {
    width: 46px; height: 46px;
    flex-shrink: 0;
    display: grid; place-items: center;
    color: #ffffff;
  }
  .ib-weather-icon {
    width: 52px; height: 52px;
    flex-shrink: 0;
    display: grid; place-items: center;
    font-size: 38px;
    line-height: 1;
  }

  .ib-text { min-width: 0; }
  .ib-title { margin-bottom: 4px; font-size: 13.5px; font-weight: 700; color: #ffffff; }
  .ib-line { font-size: 13px; line-height: 1.6; color: #c5d0e4; overflow-wrap: anywhere; }
  .ib-clock {
    margin: 2px 0 4px;
    font-family: 'Inter', 'Noto Sans Bengali', system-ui, sans-serif;
    font-size: 24px;
    font-weight: 800;
    line-height: 1.2;
    letter-spacing: .3px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .ib-temp { margin-bottom: 3px; font-size: 26px; font-weight: 800; line-height: 1.1; }

  .ib-weather { flex-wrap: wrap; row-gap: 12px; }
  .ib-stats {
    display: flex;
    flex-direction: column;
    gap: 3px;
    padding-left: 6px;
    font-size: 13px;
    color: #c5d0e4;
    min-width: 0;
  }
  .ib-stats b { font-weight: 600; color: #ffffff; overflow-wrap: anywhere; }

  /* সাইডবার থাকলে জায়গা কম, তাই ১৪০০px-এর নিচে দুই কলাম */
  @media (max-width: 1400px) {
    .ib-bar { grid-template-columns: 1fr 1fr; }
    .ib-bar .ib-weather {
      grid-column: 1 / -1;
      border-left: 0;
      border-top: 1px solid rgba(255, 255, 255, .12);
    }
  }

  @media (max-width: 720px) {
    .ib-footer { padding: 6px 12px 14px; }
    .ib-bar { grid-template-columns: 1fr; }
    .ib-bar .ib-sec + .ib-sec { border-left: 0; border-top: 1px solid rgba(255, 255, 255, .12); }
    .ib-sec { padding: 14px 16px; }
  }
</style>

<footer class="ib-footer" id="appFooter">
  <div class="ib-bar">

    <div class="ib-sec ib-date">
      <div class="ib-icon-box" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      </div>
      <div class="ib-text">
        <div class="ib-title">আজকের তারিখ</div>
        <div class="ib-line" id="ibBanglaDate">লোড হচ্ছে...</div>
        <div class="ib-line" id="ibGregDate"></div>
        <div class="ib-line" id="ibHijriDate">হিজরি তারিখ লোড হচ্ছে...</div>
      </div>
    </div>

    <div class="ib-sec ib-time">
      <div class="ib-icon-plain" aria-hidden="true">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      </div>
      <div class="ib-text">
        <div class="ib-title">বর্তমান সময়</div>
        <div class="ib-clock" id="ibClock">--:--:--</div>
        <div class="ib-line" id="ibDayPeriod"></div>
      </div>
    </div>

    <div class="ib-sec ib-weather">
      <div class="ib-weather-icon" id="ibWeatherIcon" aria-hidden="true">⏳</div>
      <div class="ib-text">
        <div class="ib-title">আবহাওয়া</div>
        <div class="ib-temp" id="ibTemp">--°C</div>
        <div class="ib-line" id="ibCondition">লোড হচ্ছে...</div>
      </div>
      <div class="ib-stats">
        <div>আর্দ্রতা: <b id="ibHumidity">--</b></div>
        <div>বাতাস: <b id="ibWind">--</b></div>
        <div>অবস্থান: <b id="ibLocation">--</b></div>
      </div>
    </div>

  </div>
</footer>

<script>
  (function () {
    'use strict';

    if (window.__infoFooterInit) return;
    window.__infoFooterInit = true;

    var TIMEZONE = 'Asia/Dhaka';
    var DEFAULT_CONFIG = { lat: 22.3596, lng: 90.3298, locationName: 'পটুয়াখালী' };

    var config = null;
    var lastDateKey = null;
    var weatherRetryPending = false;
    var hijriLoaded = false;

    var BANGLA_DIGITS = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
    var BANGLA_MONTHS = [
      'বৈশাখ', 'জ্যৈষ্ঠ', 'আষাঢ়', 'শ্রাবণ', 'ভাদ্র', 'আশ্বিন',
      'কার্তিক', 'অগ্রহায়ণ', 'পৌষ', 'মাঘ', 'ফাল্গুন', 'চৈত্র'
    ];
    var HIJRI_MONTHS = [
      'মুহররম', 'সফর', 'রবিউল আউয়াল', 'রবিউস সানি', 'জমাদিউল আউয়াল', 'জমাদিউস সানি',
      'রজব', 'শাবান', 'রমজান', 'শাওয়াল', 'জিলকদ', 'জিলহজ'
    ];

    function el(id) { return document.getElementById(id); }
    function pad2(v) { return String(v).padStart(2, '0'); }
    function bnDigits(v) {
      return String(v).replace(/[0-9]/g, function (d) { return BANGLA_DIGITS[Number(d)]; });
    }

    /* ---------- Formatters (একবারই তৈরি, প্রতি সেকেন্ডে আবার নয়) ---------- */
    var fmtParts = new Intl.DateTimeFormat('en-CA', {
      timeZone: TIMEZONE, year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23'
    });
    var fmtClock = new Intl.DateTimeFormat('en-US', {
      timeZone: TIMEZONE, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true
    });
    var fmtWeekdayBn = new Intl.DateTimeFormat('bn-BD', { timeZone: TIMEZONE, weekday: 'long' });
    var fmtWeekdayEn = new Intl.DateTimeFormat('en-US', { timeZone: TIMEZONE, weekday: 'long' });
    var fmtMonthEn = new Intl.DateTimeFormat('en-US', { timeZone: TIMEZONE, month: 'long' });

    function dhakaParts(now) {
      var data = {};
      fmtParts.formatToParts(now).forEach(function (part) {
        if (part.type !== 'literal') data[part.type] = Number(part.value);
      });
      return data;
    }

    /* ---------- সময়ের অংশ: ভোর / সকাল / দুপুর / বিকাল / সন্ধ্যা / রাত ---------- */
    function periodOfDay(hour) {
      if (hour < 4) return 'রাত';
      if (hour < 6) return 'ভোর';
      if (hour < 12) return 'সকাল';
      if (hour < 15) return 'দুপুর';
      if (hour < 17) return 'বিকাল';
      if (hour < 19) return 'সন্ধ্যা';
      return 'রাত';
    }

    /* ---------- বাংলা তারিখ (Home পেজের হিসাবের সাথে একই) ---------- */
    function bengaliDate(p) {
      var year = p.year, month = p.month, day = p.day;

      var afterNewYear = (month > 4 || (month === 4 && day >= 14));
      var newYearYear = afterNewYear ? year : year - 1;
      var start = Date.UTC(newYearYear, 3, 14);
      var current = Date.UTC(year, month - 1, day);
      var days = Math.floor((current - start) / 86400000);
      var bengaliYear = afterNewYear ? year - 593 : year - 594;

      var monthDays = [31, 31, 31, 31, 31, 30, 30, 30, 30, 30, 30, 30];
      monthDays[11] = ((bengaliYear + 594) % 4 === 0) ? 31 : 30;

      var monthIndex = 0;
      while (monthIndex < 11 && days >= monthDays[monthIndex]) {
        days -= monthDays[monthIndex];
        monthIndex++;
      }
      return bnDigits(days + 1) + ' ' + BANGLA_MONTHS[monthIndex] + ' ' + bnDigits(bengaliYear);
    }

    /* ---------- ঘড়ি ও তারিখ ---------- */
    function renderDates(p, now) {
      el('ibBanglaDate').textContent = bengaliDate(p) + ', ' + fmtWeekdayBn.format(now);
      el('ibGregDate').textContent = pad2(p.day) + ' ' + fmtMonthEn.format(now) + ' ' + p.year + ', ' + fmtWeekdayEn.format(now);
    }

    function tick() {
      var now = new Date();
      var p = dhakaParts(now);

      el('ibClock').textContent = fmtClock.format(now);
      el('ibDayPeriod').textContent = fmtWeekdayBn.format(now) + ', ' + periodOfDay(p.hour);

      var key = p.year + '-' + pad2(p.month) + '-' + pad2(p.day);
      if (key !== lastDateKey) {
        var firstRun = lastDateKey === null;
        lastDateKey = key;
        renderDates(p, now);
        if (!firstRun) loadHijri(); // তারিখ বদলালে হিজরিও নতুন করে আনো
      }
    }

    /* ---------- হিজরি তারিখ (Aladhan) ---------- */
    function loadHijri() {
      var p = dhakaParts(new Date());
      var url = 'https://api.aladhan.com/v1/gToH?date=' + pad2(p.day) + '-' + pad2(p.month) + '-' + p.year;

      fetch(url, { cache: 'no-store' })
        .then(function (response) { if (!response.ok) throw new Error('Hijri API error'); return response.json(); })
        .then(function (result) {
          if (!result || !result.data || !result.data.hijri) throw new Error('Invalid Hijri data');
          var h = result.data.hijri;
          var monthName = HIJRI_MONTHS[Number(h.month.number) - 1] || h.month.en;
          el('ibHijriDate').textContent = bnDigits(h.day) + ' ' + monthName + ' ' + bnDigits(h.year) + ' হিজরি';
          hijriLoaded = true;
        })
        .catch(function () {
          // আগে একবার সফল হয়ে থাকলে পুরনো (সঠিক) তারিখই দেখাতে থাকো
          if (!hijriLoaded) el('ibHijriDate').textContent = 'হিজরি তারিখ পাওয়া যায়নি';
        });
    }

    /* ---------- আবহাওয়া (Open-Meteo) ---------- */
    function weatherInfo(code, isDay) {
      var map = {
        0: ['পরিষ্কার আকাশ', '☀️'], 1: ['প্রায় পরিষ্কার', '🌤️'], 2: ['আংশিক মেঘলা', '⛅'], 3: ['মেঘলা', '☁️'],
        45: ['কুয়াশা', '🌫️'], 48: ['কুয়াশা', '🌫️'],
        51: ['হালকা গুঁড়ি বৃষ্টি', '🌦️'], 53: ['গুঁড়ি বৃষ্টি', '🌦️'], 55: ['ঘন গুঁড়ি বৃষ্টি', '🌧️'],
        61: ['হালকা বৃষ্টি', '🌦️'], 63: ['বৃষ্টি', '🌧️'], 65: ['ভারী বৃষ্টি', '🌧️'],
        71: ['হালকা তুষারপাত', '🌨️'], 73: ['তুষারপাত', '🌨️'], 75: ['ভারী তুষারপাত', '❄️'],
        80: ['বৃষ্টির ঝাপটা', '🌦️'], 81: ['বৃষ্টির ঝাপটা', '🌧️'], 82: ['ভারী বৃষ্টির ঝাপটা', '⛈️'],
        95: ['বজ্রঝড়', '⛈️'], 96: ['শিলাসহ বজ্রঝড়', '⛈️'], 99: ['ভারী শিলাসহ বজ্রঝড়', '⛈️']
      };
      var info = (map[Number(code)] || ['আবহাওয়ার তথ্য', '🌤️']).slice();
      if (!isDay) {
        var c = Number(code);
        if (c === 0 || c === 1) info[1] = '🌙';
        else if (c === 2) info[1] = '☁️';
      }
      return info;
    }

    function locationText() {
      var name = (config && config.locationName) || DEFAULT_CONFIG.locationName;
      return name.indexOf('বাংলাদেশ') === -1 ? name + ', বাংলাদেশ' : name;
    }

    function showWeatherError() {
      el('ibWeatherIcon').textContent = '⚠️';
      el('ibTemp').textContent = '--°C';
      el('ibCondition').textContent = 'আবহাওয়ার তথ্য পাওয়া যায়নি';
      el('ibHumidity').textContent = '--';
      el('ibWind').textContent = '--';

      if (!weatherRetryPending) {
        weatherRetryPending = true;
        setTimeout(function () { weatherRetryPending = false; loadWeather(); }, 60 * 1000);
      }
    }

    function loadWeather() {
      if (!config) return;

      var url = 'https://api.open-meteo.com/v1/forecast' +
        '?latitude=' + encodeURIComponent(config.lat) +
        '&longitude=' + encodeURIComponent(config.lng) +
        '&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code,is_day' +
        '&timezone=Asia%2FDhaka&temperature_unit=celsius&wind_speed_unit=kmh';

      fetch(url, { cache: 'no-store' })
        .then(function (response) { if (!response.ok) throw new Error('Weather API error'); return response.json(); })
        .then(function (result) {
          var c = result && result.current;
          if (!c) throw new Error('Invalid weather data');

          var info = weatherInfo(c.weather_code, c.is_day !== 0);
          el('ibWeatherIcon').textContent = info[1];
          el('ibTemp').textContent = Math.round(Number(c.temperature_2m)) + '°C';
          el('ibCondition').textContent = info[0];
          el('ibHumidity').textContent = Math.round(Number(c.relative_humidity_2m)) + '%';
          el('ibWind').textContent = Math.round(Number(c.wind_speed_10m)) + ' কিমি/ঘণ্টা';
        })
        .catch(showWeatherError);
    }

    /* ---------- শুরু ---------- */
    function init(cfg) {
      config = Object.assign({}, DEFAULT_CONFIG, cfg || {});
      if (!isFinite(config.lat) || !isFinite(config.lng)) {
        config.lat = DEFAULT_CONFIG.lat;
        config.lng = DEFAULT_CONFIG.lng;
      }
      el('ibLocation').textContent = locationText();
      loadWeather();
    }

    tick();
    setInterval(tick, 1000);

    loadHijri();
    setInterval(loadHijri, 10 * 60 * 1000);
    setInterval(loadWeather, 5 * 60 * 1000);

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function (cfg) { init(cfg); })
        .withFailureHandler(function () { init(DEFAULT_CONFIG); })
        .getHomeConfig();
    } else {
      init(DEFAULT_CONFIG);
    }
  })();
</script>
