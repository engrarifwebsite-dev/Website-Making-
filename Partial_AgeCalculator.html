<!--
  Partial_AgeCalculator.html
  এজ ক্যালকুলেটর (ব্যক্তিগত তথ্য > এজ ক্যালকুলেটর সাবট্যাব)।
  Index.html-এ Page_PersonalInfo-এর পরে include করা হয়; নিচের স্ক্রিপ্ট
  সাবট্যাব বাটন ও প্যানেল #page-personal-info-এর ভেতরে যোগ করে দেয়
  (ফ্যামিলি ট্রির পাশে)। সাবট্যাব পরিবর্তন JS_App.html-এর জেনেরিক হ্যান্ডলার করে।
  সার্ভার কোড লাগে না — হিসাব পুরোটাই ব্রাউজারে হয়।
-->
<style>
  /* সব ক্লাস ac- দিয়ে শুরু — অন্য পেজের সাথে সংঘর্ষ নেই */
  .ac-head { margin-bottom: 16px; }
  .ac-title { font-size: 19px; font-weight: 800; color: var(--navy); margin: 0 0 4px; }
  .ac-sub { font-size: 13px; color: var(--text-muted); margin: 0; }

  .ac-form { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 18px; }
  .ac-field label { display: block; font-size: 12.5px; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; }
  .ac-field-row { display: flex; gap: 8px; }
  .ac-field-row .form-input { flex: 1; min-width: 0; }
  .ac-mini {
    flex-shrink: 0;
    border: 1px solid var(--border); background: #f8fafc; color: var(--navy);
    border-radius: 8px; padding: 0 12px;
    font-size: 12px; font-weight: 700; font-family: inherit; cursor: pointer;
  }
  .ac-mini:hover { background: var(--accent-soft); }

  .ac-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  .ac-error { min-height: 18px; margin-top: 10px; font-size: 13px; font-weight: 600; color: var(--danger); }

  .ac-result { margin-top: 6px; }
  .ac-empty {
    text-align: center; padding: 34px 14px;
    border: 1px dashed var(--border); border-radius: 14px;
    color: var(--text-muted); font-size: 14px; background: #fbfcfe;
  }

  .ac-hero {
    padding: 22px 22px 20px;
    border-radius: 16px;
    color: #fff;
    background:
      radial-gradient(circle at 92% 12%, rgba(255, 255, 255, .22), transparent 40%),
      linear-gradient(135deg, #0ea5e9, #6366f1 55%, #a855f7);
    box-shadow: 0 14px 34px rgba(99, 102, 241, .28);
  }
  .ac-hero-label { font-size: 13px; font-weight: 600; opacity: .92; }
  .ac-hero-main { margin-top: 6px; font-size: clamp(24px, 4.4vw, 36px); font-weight: 800; line-height: 1.3; }
  .ac-hero-note { margin-top: 8px; font-size: 13px; opacity: .92; }

  .ac-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 14px; }
  .ac-tile { padding: 14px 14px 12px; border-radius: 14px; color: #fff; }
  .ac-tile-label { font-size: 12px; font-weight: 600; opacity: .92; }
  .ac-tile-value { margin-top: 4px; font-size: 20px; font-weight: 800; line-height: 1.3; word-break: break-word; }
  .ac-tile-sub { margin-top: 3px; font-size: 11.5px; opacity: .9; }
  .ac-t1 { background: linear-gradient(135deg, #34d399, #059669); }
  .ac-t2 { background: linear-gradient(135deg, #fbbf24, #f97316); }
  .ac-t3 { background: linear-gradient(135deg, #f472b6, #a855f7); }
  .ac-t4 { background: linear-gradient(135deg, #38bdf8, #2563eb); }
  .ac-t5 { background: linear-gradient(135deg, #f87171, #dc2626); }
  .ac-t6 { background: linear-gradient(135deg, #2dd4bf, #0f766e); }

  @media (max-width: 640px) {
    .ac-form { grid-template-columns: 1fr; }
  }
</style>

<div id="acRoot">
  <div class="card">
    <div class="ac-head">
      <h2 class="ac-title">🧮 এজ ক্যালকুলেটর</h2>
      <p class="ac-sub">দুটি তারিখ দিন — মাঝের সময়টি বছর, মাস ও দিনে হিসাব হয়ে যাবে।</p>
    </div>

    <div class="ac-form">
      <div class="ac-field">
        <label for="acFrom">শুরুর তারিখ (যেমন: জন্ম তারিখ)</label>
        <div class="ac-field-row">
          <input type="date" class="form-input" id="acFrom">
          <button type="button" class="ac-mini" id="acFromProfile" title="ব্যক্তিগত তথ্যে সংরক্ষিত জন্ম তারিখ নিন">👤 আমার জন্ম তারিখ</button>
        </div>
      </div>
      <div class="ac-field">
        <label for="acTo">শেষ তারিখ (যে তারিখ পর্যন্ত হিসাব)</label>
        <div class="ac-field-row">
          <input type="date" class="form-input" id="acTo">
          <button type="button" class="ac-mini" id="acToday">📅 আজ</button>
        </div>
      </div>
    </div>

    <div class="ac-actions">
      <button type="button" class="btn btn-primary" id="acCalc">হিসাব করুন</button>
      <button type="button" class="btn btn-outline" id="acReset">রিসেট</button>
    </div>
    <div class="ac-error" id="acError"></div>

    <div class="ac-result" id="acResult">
      <div class="ac-empty">জন্ম তারিখ ও শেষ তারিখ দিলে এখানে ফলাফল দেখা যাবে।</div>
    </div>
  </div>
</div>

<script>
  (function () {
    if (window.__ageCalcInit) return;
    window.__ageCalcInit = true;

    /* ---------- সাবট্যাব বাটন ও প্যানেল যোগ করা (ফ্যামিলি ট্রির পাশে) ---------- */
    var page = document.getElementById('page-personal-info');
    var group = page ? page.querySelector('.subtabs') : null;
    var root = document.getElementById('acRoot');
    if (!page || !group || !root) return;

    var tabBtn = document.createElement('button');
    tabBtn.type = 'button';
    tabBtn.className = 'subtab-btn';
    tabBtn.setAttribute('data-subtab', 'age-calculator');
    tabBtn.textContent = 'এজ ক্যালকুলেটর';
    group.appendChild(tabBtn);

    var panel = document.createElement('div');
    panel.className = 'subtab-panel';
    panel.id = 'subtab-age-calculator';
    panel.appendChild(root);
    page.appendChild(panel);

    /* ---------- Helpers ---------- */
    var BN_DIGITS = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
    var BN_MONTHS = ['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
    var BN_WEEKDAYS = ['রবিবার','সোমবার','মঙ্গলবার','বুধবার','বৃহস্পতিবার','শুক্রবার','শনিবার'];
    var TOKEN_KEY = 'personalAppSessionToken';

    function bn(v) { return String(v).replace(/[0-9]/g, function (d) { return BN_DIGITS[Number(d)]; }); }
    function num(n) { return bn(Number(n).toLocaleString('en-US')); }
    function el(id) { return document.getElementById(id); }

    function parseIso(s) {
      var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s || ''));
      return m ? { y: Number(m[1]), m: Number(m[2]), d: Number(m[3]) } : null;
    }
    function utc(p) { return Date.UTC(p.y, p.m - 1, p.d); }
    function fmt(p) { return bn(p.d) + ' ' + BN_MONTHS[p.m - 1] + ' ' + bn(p.y); }
    function isLeap(y) { return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0; }
    function todayIso() {
      var n = new Date();
      return n.getFullYear() + '-' + String(n.getMonth() + 1).padStart(2, '0') + '-' + String(n.getDate()).padStart(2, '0');
    }

    /* ---------- হিসাব ---------- */
    function diffYMD(a, b) {
      var y = b.y - a.y, m = b.m - a.m, d = b.d - a.d;
      if (d < 0) {
        m--;
        d += new Date(b.y, b.m - 1, 0).getDate(); // শেষ তারিখের আগের মাসের দিন সংখ্যা
      }
      if (m < 0) { y--; m += 12; }
      return { y: y, m: m, d: d };
    }

    function nextBirthday(from, to) {
      var year = to.y;
      function inYear(yr) {
        var day = from.d;
        if (from.m === 2 && from.d === 29 && !isLeap(yr)) day = 28;
        return { y: yr, m: from.m, d: day };
      }
      var cand = inYear(year);
      if (utc(cand) < utc(to)) cand = inYear(year + 1);
      var days = Math.round((utc(cand) - utc(to)) / 86400000);
      return { date: cand, days: days };
    }

    function tile(cls, label, value, sub) {
      return '<div class="ac-tile ' + cls + '"><div class="ac-tile-label">' + label + '</div>' +
        '<div class="ac-tile-value">' + value + '</div>' +
        (sub ? '<div class="ac-tile-sub">' + sub + '</div>' : '') + '</div>';
    }

    function calculate(showErrors) {
      var errorEl = el('acError');
      var resultEl = el('acResult');
      errorEl.textContent = '';

      var from = parseIso(el('acFrom').value);
      var to = parseIso(el('acTo').value);

      if (!from || !to) {
        if (showErrors) errorEl.textContent = 'দুটি তারিখই নির্বাচন করুন।';
        resultEl.innerHTML = '<div class="ac-empty">জন্ম তারিখ ও শেষ তারিখ দিলে এখানে ফলাফল দেখা যাবে।</div>';
        return;
      }
      if (utc(from) > utc(to)) {
        errorEl.textContent = 'শুরুর তারিখ শেষ তারিখের পরে হতে পারে না।';
        resultEl.innerHTML = '<div class="ac-empty">তারিখ ঠিক করুন।</div>';
        return;
      }

      var r = diffYMD(from, to);
      var totalDays = Math.round((utc(to) - utc(from)) / 86400000);
      var totalMonths = r.y * 12 + r.m;
      var weeks = Math.floor(totalDays / 7);
      var restDays = totalDays % 7;
      var weekday = BN_WEEKDAYS[new Date(utc(from)).getUTCDay()];
      var nb = nextBirthday(from, to);

      var parts = [];
      if (r.y) parts.push(bn(r.y) + ' বছর');
      if (r.m) parts.push(bn(r.m) + ' মাস');
      if (r.d || !parts.length) parts.push(bn(r.d) + ' দিন');

      var nbValue, nbSub;
      if (nb.days === 0) {
        nbValue = '🎉 আজই!';
        nbSub = bn(r.y) + ' বছর পূর্ণ হলো';
      } else {
        nbValue = bn(nb.days) + ' দিন পরে';
        nbSub = fmt(nb.date) + ' — ' + bn(nb.date.y - from.y) + ' বছর পূর্ণ হবে';
      }

      resultEl.innerHTML =
        '<div class="ac-hero">' +
          '<div class="ac-hero-label">' + fmt(from) + ' থেকে ' + fmt(to) + ' পর্যন্ত</div>' +
          '<div class="ac-hero-main">' + parts.join(' ') + '</div>' +
          '<div class="ac-hero-note">অর্থাৎ ' + bn(r.y) + ' বছর, ' + bn(r.m) + ' মাস ও ' + bn(r.d) + ' দিন</div>' +
        '</div>' +
        '<div class="ac-grid">' +
          tile('ac-t1', '📆 মোট মাস', num(totalMonths) + ' মাস', r.d ? 'আরও ' + bn(r.d) + ' দিন' : '') +
          tile('ac-t2', '🗓️ মোট সপ্তাহ', num(weeks) + ' সপ্তাহ', restDays ? 'আরও ' + bn(restDays) + ' দিন' : '') +
          tile('ac-t3', '☀️ মোট দিন', num(totalDays) + ' দিন', '') +
          tile('ac-t4', '⏱️ মোট ঘণ্টা', num(totalDays * 24) + ' ঘণ্টা', '') +
          tile('ac-t5', '🎂 পরবর্তী জন্মদিন', nbValue, nbSub) +
          tile('ac-t6', '📅 শুরুর তারিখের বার', weekday, '') +
        '</div>';
    }

    /* ---------- Events ---------- */
    el('acTo').value = todayIso();

    el('acCalc').addEventListener('click', function () { calculate(true); });
    el('acFrom').addEventListener('change', function () { calculate(false); });
    el('acTo').addEventListener('change', function () { calculate(false); });

    el('acToday').addEventListener('click', function () {
      el('acTo').value = todayIso();
      calculate(false);
    });

    el('acReset').addEventListener('click', function () {
      el('acFrom').value = '';
      el('acTo').value = todayIso();
      calculate(false);
    });

    el('acFromProfile').addEventListener('click', function () {
      if (typeof google === 'undefined' || !google.script || !google.script.run) return;
      google.script.run
        .withSuccessHandler(function (profile) {
          var dob = profile && profile.DOB ? String(profile.DOB) : '';
          if (!parseIso(dob)) {
            showToast('ব্যক্তিগত তথ্যে জন্ম তারিখ পাওয়া যায়নি।', 'warning');
            return;
          }
          el('acFrom').value = dob;
          calculate(false);
        })
        .withFailureHandler(function () {
          showToast('প্রোফাইল তথ্য লোড করা যায়নি।', 'danger');
        })
        .getProfile();
    });
  })();
</script>
