      };
      // পাওনা-সংক্রান্ত বনাম দেনা-সংক্রান্ত গ্রুপ (সাইডবার KPI কার্ডের "বিস্তারিত দেখুন" লিংক এটি ব্যবহার করে)
      var GROUP_TYPES = { receivable: ['Lent', 'RepaidToMe'], payable: ['Borrowed', 'RepaidByMe'] };

      var state = {
        data: null, reqId: 0, loadedAt: 0, everLoaded: false,
        filterType: '', filterGroup: '', filterDate: '', search: '',
        page: 1, editingId: ''
      };

      /* ---------- helpers ---------- */
      function el(id) { return document.getElementById(id); }
      function root() { return document.getElementById('page-prince-hisab'); }
      function getToken() { try { return localStorage.getItem(TOKEN_KEY); } catch (e) { return null; } }
      function esc(s) {
        return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }
      function bn(v) { return String(v).replace(/[0-9]/g, function (d) { return BN_DIGITS[Number(d)]; }); }
      function num(n) { return bn((Number(n) || 0).toLocaleString('en-US', { maximumFractionDigits: 2 })); }
      function money(n) { return '৳ ' + num(Math.abs(Number(n) || 0)); }
      function dispDate(iso) {
        var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso || ''));
        if (!m) return '—';
        return bn(Number(m[3])) + '/' + bn(Number(m[2])) + '/' + bn(m[1]);
      }
      function todayIso() { return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Dhaka' }).format(new Date()); }
      function call(fnName, args, ok, fail) {
        var runner = google.script.run
          .withSuccessHandler(ok || function () {})
          .withFailureHandler(function (err) {
            showToast((err && err.message) || 'কাজটি সম্পন্ন হয়নি।', 'danger');
            if (fail) fail(err);
          });
        runner[fnName].apply(runner, args);
      }
      function setBusy(b) { el('phBody').classList.toggle('busy', !!b); }
      function showError(msg) { el('phErrorText').textContent = msg; el('phError').classList.add('show'); }
      function hideError() { el('phError').classList.remove('show'); }
      function typeMeta(type) { return TYPE_META[type] || { icon: '💱', cls: 'ph-ico-blue' }; }
      function typeLabelOf(type) {
        var list = (state.data && state.data.types) || [];
        for (var i = 0; i < list.length; i++) if (list[i].key === type) return list[i].label;
        return type;
      }

      /* ---------- load ---------- */
      function load(cb) {
        var token = getToken();
        if (!token || typeof google === 'undefined' || !google.script || !google.script.run) return;

        var id = ++state.reqId;
        hideError();
        setBusy(true);

        google.script.run
          .withSuccessHandler(function (d) {
            if (id !== state.reqId) return;
            applyData(d);
            setBusy(false);
            if (typeof cb === 'function') cb();
          })
          .withFailureHandler(function (err) {
            if (id !== state.reqId) return;
            setBusy(false);
            showError((err && err.message) || 'হিসাবের তথ্য লোড করা যায়নি।');
          })
          .getPrinceHisabData(token);
      }

      function applyData(d) {
        state.data = d;
        state.loadedAt = Date.now();
        state.everLoaded = true;
        populateTypeSelects();
        render();
      }

      function populateTypeSelects() {
        var types = (state.data && state.data.types) || [];
        var filterSel = el('phFilterType');
        var curFilter = filterSel.value;
        filterSel.innerHTML = '<option value="">সব লেনদেন</option>' + types.map(function (t) {
          return '<option value="' + esc(t.key) + '">' + esc(t.label) + '</option>';
        }).join('');
        filterSel.value = curFilter;

        var formSel = el('phfType');
        var curForm = formSel.value;
        formSel.innerHTML = '<option value="">লেনদেনের ধরন নির্বাচন করুন</option>' + types.map(function (t) {
          return '<option value="' + esc(t.key) + '">' + esc(t.label) + '</option>';
        }).join('');
        formSel.value = curForm;
      }

      function render() {
        var d = state.data;
        if (!d) return;
        renderKpis(d);
        renderDonut(d);
        renderFacts(d);
        renderTable();
      }

      /* ---------- ৪টি উপরের কার্ড ---------- */
      var SVG = {
        handUp: '<svg viewBox="0 0 24 24"><path d="M11 21v-6M11 15l-3-3m3 3l3-3"/><path d="M5 10a7 7 0 0 1 12.6-4.2M19 10a7 7 0 0 1-1 3.6"/></svg>',
        handDown: '<svg viewBox="0 0 24 24"><path d="M11 3v6M11 9l-3 3m3-3l3 3"/><path d="M5 14a7 7 0 0 0 12.6 4.2M19 14a7 7 0 0 0-1-3.6"/></svg>',
        scale: '<svg viewBox="0 0 24 24"><path d="M12 3v18M7 7l-4 8a4 4 0 0 0 8 0zM17 7l-4 8a4 4 0 0 0 8 0z"/><path d="M5 7h14M9 3h6"/></svg>',
        wallet: '<svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h13v3"/><path d="M3 7v11a2 2 0 0 0 2 2h14a1 1 0 0 0 1-1V9a1 1 0 0 0-1-1H5a2 2 0 0 1-2-1z"/><circle cx="16.5" cy="14" r="1.2"/></svg>'
      };

      function renderKpis(d) {
        var s = d.summary;
        var net = Number(s.net) || 0;
        var netBadge = net > 0 ? ['green', 'আমার পক্ষে'] : (net < 0 ? ['red', 'Prince-এর পক্ষে'] : ['gray', 'সমান']);

        el('phKpis').innerHTML =
          '<div class="ph-card ph-kpi"><div class="ph-kpi-ico ph-ico-green">' + SVG.handUp + '</div>' +
            '<div><div class="ph-kpi-label">Prince-এর কাছে<br>আমার পাওনা</div>' +
            '<div class="ph-kpi-value green">' + money(s.receivable) + '</div>' +
            '<div class="ph-kpi-sub">মোট ' + bn(s.receivableCount) + 'টি লেনদেন</div>' +
            '<button type="button" class="ph-kpi-link" data-act="kpi-receivable">বিস্তারিত দেখুন →</button></div></div>' +

          '<div class="ph-card ph-kpi"><div class="ph-kpi-ico ph-ico-red">' + SVG.handDown + '</div>' +
            '<div><div class="ph-kpi-label">Prince-এর কাছে<br>আমার দেনা</div>' +
            '<div class="ph-kpi-value red">' + money(s.payable) + '</div>' +
            '<div class="ph-kpi-sub">মোট ' + bn(s.payableCount) + 'টি লেনদেন</div>' +
            '<button type="button" class="ph-kpi-link" data-act="kpi-payable">বিস্তারিত দেখুন →</button></div></div>' +

          '<div class="ph-card ph-kpi"><div class="ph-kpi-ico ph-ico-blue">' + SVG.scale + '</div>' +
            '<div><div class="ph-kpi-label">নিট পাওনা (পাওনা - দেনা)</div>' +
            '<div class="ph-kpi-value blue">' + money(net) + '</div>' +
            '<div class="ph-kpi-badge ' + netBadge[0] + '">' + netBadge[1] + '</div><br>' +
            '<button type="button" class="ph-kpi-link" data-act="kpi-net">বিস্তারিত দেখুন →</button></div></div>' +

          '<div class="ph-card ph-kpi"><div class="ph-kpi-ico ph-ico-amber">' + SVG.wallet + '</div>' +
            '<div><div class="ph-kpi-label">সর্বশেষ ব্যালেন্স হালনাগাদ</div>' +
            '<div class="ph-kpi-value" style="font-size:17px;">' + (s.lastDate ? dispDate(s.lastDate) : '—') + '</div>' +
            '<div class="ph-kpi-check">✅ সবসময় লাইভ হিসাব</div></div></div>';
      }

      /* ---------- ডোনাট (হিসাবের সারসংক্ষেপ) ---------- */
      function renderDonut(d) {
        var s = d.summary;
        var receivable = Math.max(0, Number(s.receivable) || 0);
        var payable = Math.max(0, Number(s.payable) || 0);
        var total = receivable + payable;
        var net = Number(s.net) || 0;
        var netLabel = net > 0 ? '(আমার পক্ষে)' : (net < 0 ? '(Prince-এর পক্ষে)' : '(সমান)');

        var host = el('phDonut');
        if (total <= 0) {
          host.innerHTML = '<div class="ph-empty">এখনো কোনো লেনদেন নেই।</div>';
          return;
        }

        var r = 58, c = 2 * Math.PI * r;
        var gLen = receivable / total * c;
        var svg = '<svg viewBox="0 0 150 150" role="img" aria-label="পাওনা বনাম দেনার অনুপাত">' +
          '<circle cx="75" cy="75" r="' + r + '" fill="none" stroke="#fee2e2" stroke-width="20"/>' +
          (receivable > 0 ? '<circle cx="75" cy="75" r="' + r + '" fill="none" stroke="#15803d" stroke-width="20" stroke-dasharray="' + gLen + ' ' + (c - gLen) + '" transform="rotate(-90 75 75)"/>' : '') +
          '<text x="75" y="68" text-anchor="middle" font-size="11" fill="#64748b">নিট পাওনা</text>' +
          '<text x="75" y="88" text-anchor="middle" font-size="17" font-weight="800" fill="#10233F">' + money(net) + '</text>' +
          '<text x="75" y="103" text-anchor="middle" font-size="10" fill="#64748b">' + netLabel + '</text>' +
          '</svg>';

        host.innerHTML = '<div class="ph-donut-wrap"><div class="ph-donut">' + svg + '</div>' +
          '<div class="ph-donut-legend">' +
            '<span><i style="background:#15803d"></i>পাওনা ৳ ' + num(receivable) + '</span>' +
            '<span><i style="background:#dc2626"></i>দেনা ৳ ' + num(payable) + '</span>' +
          '</div></div>';
      }

      /* ---------- দ্রুত তথ্য ---------- */
      function renderFacts(d) {
        var s = d.summary;
        function row(icon, label, val) {
          return '<div class="ph-fact-row"><span class="ph-fact-label">' + icon + ' ' + label + '</span><span class="ph-fact-val">' + val + '</span></div>';
        }
        el('phFacts').innerHTML =
          row('📅', 'প্রথম লেনদেনের তারিখ', s.firstDate ? dispDate(s.firstDate) : '—') +
          row('📈', 'মোট পাওনা লেনদেন', bn(s.receivableCount) + ' টি') +
          row('📉', 'মোট দেনা লেনদেন', bn(s.payableCount) + ' টি') +
          row('🕒', 'সর্বশেষ লেনদেন', s.lastDate ? dispDate(s.lastDate) : '—');
      }

      /* ---------- টেবিল (ফিল্টার + পেজিনেশন) ---------- */
      function filteredTransactions() {
        var list = (state.data && state.data.transactions) || [];
        var q = state.search.trim().toLowerCase();
        return list.filter(function (t) {
          if (state.filterType && t.type !== state.filterType) return false;
          if (state.filterGroup) {
            var allowed = GROUP_TYPES[state.filterGroup] || [];
            if (allowed.indexOf(t.type) === -1) return false;
          }
          if (state.filterDate && t.date < state.filterDate) return false;
          if (q) {
            var hay = (t.label + ' ' + t.note + ' ' + t.status).toLowerCase();
            if (hay.indexOf(q) === -1) return false;
          }
          return true;
        });
      }

      function listScopeText() {
        if (state.filterGroup === 'receivable') return 'পাওনা সংক্রান্ত';
        if (state.filterGroup === 'payable') return 'দেনা সংক্রান্ত';
        if (state.filterType) return typeLabelOf(state.filterType);
        return 'সব লেনদেন';
      }

      function typeCellHtml(t) {
        var meta = typeMeta(t.type);
        return '<div class="ph-type-cell"><span class="ph-type-ico ' + meta.cls + '">' + meta.icon + '</span>' +
          '<span class="ph-type-text">' + esc(t.label) + '</span></div>';
      }

      function descCellHtml(t) {
        var main = t.note ? esc(t.note) : 'কোনো বিবরণ দেওয়া হয়নি';
        return '<div class="ph-desc"><div class="ph-desc-main" title="' + esc(t.note || '') + '">' + main + '</div>' +
          '<div class="ph-desc-note">নোট: ' + (t.note ? esc(t.note) : 'কোনো নোট নেই') + '</div></div>';
      }

      var ICON_EDIT = '<svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
      var ICON_DEL = '<svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/><path d="M10 11v6M14 11v6"/></svg>';

      function renderTable() {
        var list = filteredTransactions();
        el('phListScope').textContent = listScopeText();
        var host = el('phTable');

        if (!list.length) {
          host.innerHTML = '<div class="ph-empty">এই ফিল্টারে কোনো লেনদেন পাওয়া যায়নি।</div>';
          el('phTableFoot').style.display = 'none';
          return;
        }

        var totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
        if (state.page > totalPages) state.page = totalPages;
        if (state.page < 1) state.page = 1;
        var start = (state.page - 1) * PAGE_SIZE;
        var shown = list.slice(start, start + PAGE_SIZE);

        var rows = shown.map(function (t) {
          var tagCls = t.type === 'Borrowed' ? 'red' : 'green';
          var amtCls = t.signedAmount >= 0 ? 'pos' : 'neg';
          var amtSign = t.signedAmount >= 0 ? '+' : '-';
          return '<tr>' +
            '<td>' + dispDate(t.date) + '</td>' +
            '<td>' + typeCellHtml(t) + '</td>' +
            '<td>' + descCellHtml(t) + '</td>' +
            '<td><span class="ph-amount ' + amtCls + '">' + amtSign + num(Math.abs(t.signedAmount)) + '</span></td>' +
            '<td><span class="ph-tag ' + tagCls + '">' + esc(t.status) + '</span></td>' +
            '<td><span class="ph-actcol">' +
              '<button type="button" class="ph-iconbtn" data-act="edit-txn" data-id="' + esc(t.id) + '" title="সম্পাদনা">' + ICON_EDIT + '</button>' +
              '<button type="button" class="ph-iconbtn del" data-act="del-txn" data-id="' + esc(t.id) + '" title="মুছুন">' + ICON_DEL + '</button>' +
            '</span></td></tr>';
        }).join('');

        host.innerHTML = '<div class="ph-table-wrap"><table class="ph-table"><thead><tr>' +
          '<th>তারিখ</th><th>লেনদেনের ধরন</th><th>বিবরণ</th><th>পরিমাণ (৳)</th><th>অবস্থা</th><th>অ্যাকশন</th>' +
          '</tr></thead><tbody>' + rows + '</tbody></table></div>';

        el('phTableFoot').style.display = 'flex';
        el('phTotalTxt').textContent = 'মোট লেনদেন: ' + bn(list.length) + 'টি';

        var pagerHtml = '<button type="button" data-act="page-prev" ' + (state.page <= 1 ? 'disabled' : '') + ' aria-label="আগের পাতা">‹</button>' +
          '<span class="cur">' + bn(state.page) + '</span>' +
          '<button type="button" data-act="page-next" ' + (state.page >= totalPages ? 'disabled' : '') + ' aria-label="পরের পাতা">›</button>';
        el('phPager').innerHTML = pagerHtml;
      }

      /* =====================================================
         ইনলাইন ফর্ম: যোগ / সম্পাদনা
         ===================================================== */
      function findTxn(id) {
        var list = (state.data && state.data.transactions) || [];
        for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
        return null;
      }

      function resetFormToAddMode() {
        state.editingId = '';
        el('phFormTitle').textContent = 'নতুন লেনদেন যোগ করুন';
        el('phEditChip').style.display = 'none';
        el('phFormCard').classList.remove('editing');
        el('phfSubmit').textContent = '✓ সংরক্ষণ করুন';
        el('phfDate').value = todayIso();
        el('phfType').value = '';
        el('phfAmount').value = '';
        el('phfNote').value = '';
      }

      function enterEditMode(id) {
        var t = findTxn(id);
        if (!t) return;
        state.editingId = id;
        el('phFormTitle').textContent = 'লেনদেন সম্পাদনা করুন';
        el('phEditChip').style.display = 'inline-block';
        el('phFormCard').classList.add('editing');
        el('phfSubmit').textContent = '✓ আপডেট করুন';
        el('phfDate').value = t.date;
        el('phfType').value = t.type;
        el('phfAmount').value = t.amount;
        el('phfNote').value = t.note || '';
        scrollToForm();
        setTimeout(function () { el('phfDate').focus(); }, 300);
      }

      function scrollToForm() {
        var card = el('phFormCard');
        if (card && card.scrollIntoView) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }

      function submitForm() {
        var date = el('phfDate').value;
        var type = el('phfType').value;
        var amount = el('phfAmount').value;
        var note = el('phfNote').value;

        if (!date) { showToast('তারিখ দিন।', 'warning'); return; }
        if (!type) { showToast('লেনদেনের ধরন নির্বাচন করুন।', 'warning'); return; }
        if (!amount || Number(amount) <= 0) { showToast('পরিমাণ ০-র বেশি লিখুন।', 'warning'); return; }

        var payload = { id: state.editingId || '', date: date, type: type, amount: amount, note: note };
        var wasEditing = !!state.editingId;

        call('savePrinceHisabTransaction', [getToken(), payload], function (freshData) {
          applyData(freshData);
          resetFormToAddMode();
          showToast(wasEditing ? 'লেনদেন আপডেট হয়েছে।' : 'নতুন লেনদেন যোগ হয়েছে।', 'success');
        });
      }

      function confirmDeleteTxn(id) {
        var t = findTxn(id);
        if (!t) return;
        confirmDialog('"' + esc(t.label) + '" — ' + dispDate(t.date) + ' তারিখের এই লেনদেনটি মুছে ফেলবেন?', function () {
          call('deletePrinceHisabTransaction', [getToken(), id], function (freshData) {
            if (state.editingId === id) resetFormToAddMode();
            applyData(freshData);
            showToast('লেনদেন মুছে ফেলা হয়েছে।', 'success');
          });
        });
      }

      /* =====================================================
         রিপোর্ট: PDF (প্রিন্ট) ও Excel (CSV)
         ===================================================== */
      function printHtml(title, inner) {
        var w = window.open('', '_blank');
        if (!w) { showToast('পপআপ আটকে গেছে — ব্রাউজারে পপআপ অনুমতি দিন।', 'warning'); return; }
        w.document.write('<!DOCTYPE html><html><head><meta charset="utf-8"><title>' + esc(title) + '</title>' +
          '<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">' +
          '<style>body{font-family:"Noto Sans Bengali",Arial,sans-serif;color:#10233F;padding:28px;font-size:13px}h1{font-size:20px;margin:0 0 4px}' +
          '.sum{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.sum div{border:1px solid #d7dde8;border-radius:8px;padding:10px 14px;min-width:150px}.sum b{display:block;font-size:16px;margin-top:3px}' +
          'table{width:100%;border-collapse:collapse;margin-bottom:8px}th,td{border:1px solid #d7dde8;padding:7px 9px;text-align:right}th:first-child,td:first-child{text-align:left}th{background:#f1f5fb}</style></head><body>' +
          inner + '</body></html>');
        w.document.close(); w.focus();
        setTimeout(function () { w.print(); }, 900);
        showToast('প্রিন্ট উইন্ডোতে "Save as PDF" নির্বাচন করুন।', 'default');
      }

      function exportPdf() {
        var d = state.data;
        if (!d || !d.transactions.length) { showToast('এক্সপোর্ট করার মতো কোনো লেনদেন নেই।', 'warning'); return; }
        var s = d.summary;
        var rows = d.transactions.slice().reverse().map(function (t) {
          return '<tr><td>' + dispDate(t.date) + '</td><td>' + esc(t.label) + '</td><td>' + esc(t.note || '—') + '</td>' +
            '<td>' + (t.signedAmount >= 0 ? '+' : '-') + num(Math.abs(t.signedAmount)) + '</td><td>' + esc(t.status) + '</td></tr>';
        }).join('');
        printHtml('প্রিন্স হিসাব রিপোর্ট',
          '<h1>প্রিন্স হিসাব — সম্পূর্ণ রিপোর্ট</h1>' +
          '<div class="sum"><div>আমার পাওনা<b>' + money(s.receivable) + '</b></div>' +
          '<div>আমার দেনা<b>' + money(s.payable) + '</b></div>' +
          '<div>নিট পাওনা<b>' + money(s.net) + (s.net >= 0 ? ' (আমার পক্ষে)' : ' (Prince-এর পক্ষে)') + '</b></div>' +
          '<div>মোট লেনদেন<b>' + bn(s.totalCount) + ' টি</b></div></div>' +
          '<table><thead><tr><th>তারিখ</th><th>ধরন</th><th>বিবরণ/নোট</th><th>পরিমাণ (৳)</th><th>অবস্থা</th></tr></thead><tbody>' + rows + '</tbody></table>');
      }

      function csvCell(v) { return '"' + String(v === undefined || v === null ? '' : v).replace(/"/g, '""') + '"'; }

      function exportCsv() {
        var d = state.data;
        if (!d || !d.transactions.length) { showToast('এক্সপোর্ট করার মতো কোনো লেনদেন নেই।', 'warning'); return; }
        var lines = [['Date', 'Type', 'Status', 'Amount', 'SignedAmount', 'Note'].map(csvCell).join(',')];
        d.transactions.slice().reverse().forEach(function (t) {
          lines.push([csvCell(t.date), csvCell(t.label), csvCell(t.status), t.amount, t.signedAmount, csvCell(t.note)].join(','));
        });
        var blob = new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url; a.download = 'prince-hisab.csv';
        document.body.appendChild(a); a.click();
        setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
        showToast('এক্সেল ফাইল (CSV) ডাউনলোড হচ্ছে।', 'success');
      }

      /* =====================================================
         ইভেন্ট
         ===================================================== */
      root().addEventListener('click', function (e) {
        var b = e.target.closest('[data-act]');
        if (!b || b.disabled) return;
        var act = b.getAttribute('data-act');

        if (act === 'retry') load();
        else if (act === 'edit-txn') enterEditMode(b.getAttribute('data-id'));
        else if (act === 'del-txn') confirmDeleteTxn(b.getAttribute('data-id'));
        else if (act === 'page-prev') { state.page--; renderTable(); }
        else if (act === 'page-next') { state.page++; renderTable(); }
        else if (act === 'kpi-receivable') { state.filterGroup = 'receivable'; state.filterType = ''; el('phFilterGroup').value = 'receivable'; el('phFilterType').value = ''; state.page = 1; renderTable(); scrollToTable(); }
        else if (act === 'kpi-payable') { state.filterGroup = 'payable'; state.filterType = ''; el('phFilterGroup').value = 'payable'; el('phFilterType').value = ''; state.page = 1; renderTable(); scrollToTable(); }
        else if (act === 'kpi-net') { clearFilters(); scrollToTable(); }
      });

      function scrollToTable() {
        var t = el('phTable');
        if (t && t.scrollIntoView) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }

      function clearFilters() {
        state.filterType = ''; state.filterGroup = ''; state.filterDate = ''; state.search = ''; state.page = 1;
        el('phFilterType').value = ''; el('phFilterGroup').value = ''; el('phFilterDate').value = ''; el('phSearch').value = '';
        renderTable();
      }

      el('phFilterType').addEventListener('change', function () { state.filterType = this.value; state.page = 1; renderTable(); });
      el('phFilterGroup').addEventListener('change', function () { state.filterGroup = this.value; state.page = 1; renderTable(); });
      el('phFilterDate').addEventListener('change', function () { state.filterDate = this.value; state.page = 1; renderTable(); });
      el('phSearchBtn').addEventListener('click', function () { state.search = el('phSearch').value; state.page = 1; renderTable(); });
      el('phSearch').addEventListener('keydown', function (e) { if (e.key === 'Enter') { state.search = this.value; state.page = 1; renderTable(); } });
      el('phClearFilters').addEventListener('click', clearFilters);

      el('phAddBtn').addEventListener('click', function () {
        if (state.editingId) resetFormToAddMode();
        scrollToForm();
        setTimeout(function () { el('phfDate').focus(); }, 300);
      });
      el('phfCancel').addEventListener('click', resetFormToAddMode);
      el('phfSubmit').addEventListener('click', submitForm);
      el('phPdfBtn').addEventListener('click', exportPdf);
      el('phCsvBtn').addEventListener('click', exportCsv);

      /* ---------- পেজ খোলা হলে (এবং লগইনের পরে) লোড ---------- */
      function isActive() { return root().classList.contains('active'); }
      function isAuthed() { return document.body.classList.contains('authenticated'); }
      function maybeLoad() {
        if (!isActive() || !isAuthed()) return;
        if (!state.everLoaded || Date.now() - state.loadedAt > 60000) load();
      }
      new MutationObserver(maybeLoad).observe(root(), { attributes: true, attributeFilter: ['class'] });
      new MutationObserver(maybeLoad).observe(document.body, { attributes: true, attributeFilter: ['class'] });

      el('phfDate').value = todayIso();
      maybeLoad();
    })();
  </script>

</section>
