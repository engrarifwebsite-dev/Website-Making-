  <div class="subtab-panel" id="subtab-pg-leave">
    <div class="page-placeholder">
      <h2>ছুটির হিসাব</h2>
      <p>এই ট্যাবের কন্টেন্ট পরবর্তী ধাপে যুক্ত হবে।</p>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      if (window.__powerGridInit) return;
      window.__powerGridInit = true;

      var TOKEN_KEY = 'personalAppSessionToken';
      var BN_DIGITS = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
      var BN_MONTHS = ['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
      var BN_MONTHS_SHORT = ['জানু','ফেব্রু','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টে','অক্টো','নভে','ডিসে'];

      var EARN = [
        ['basic', 'Basic Salary'], ['educationAllowance', 'Education Allowance'], ['incrementArrear', 'Increment/Arrear'],
        ['houseRent', 'House Rent'], ['officerMedical', "Officer's Medical Reimbursement"], ['medicalAllowance', 'Medical Allowance'],
        ['conveyanceAllowance', 'Conveyance Allowance'], ['shiftAllowance', 'Shift Allowance'],
        ['responsibilityAllowance', 'Responsibility Allowance'], ['specialAllowance', 'Special Allowance'],
        ['employerCpfEarning', "Employer's Contribution to CPF"], ['residentElectricity', 'Resident Electricity Allowance'],
        ['chargeAllowance', 'Charge Allowance'],
        ['tiffinBill', 'Tiffin Bill'], ['taDa', 'T.A / D.A'], ['honorarium', 'Honorarium'],
        ['incentiveBonus', 'Incentive Bonus'], ['wppwfmProfit', 'WPPWFM Profit'], ['festivalBonus', 'Festival Bonus'],
        ['leaveEncashment', 'Leave Encashment'], ['banglaNoboborsha', 'Bangla Noboborsha'], ['localTraining', 'Local Training'],
        ['trainingBill', 'Training Bill']
      ];
      var DEDUCT = [
        ['houseRentDeduction', 'House Rent Deduction'], ['cpfDeduction', 'CPF Deduction'], ['incomeTax', 'Income Tax'],
        ['cpfAdvance', 'CPF Advance'], ['revenueDeduction', 'Revenue Deduction'], ['othersDeduction', 'Others Deduction'],
        ['donation', 'Donation'], ['taxWppwfm', 'Tax on WPPWFM']
      ];
      // CPF অংশ আলাদা ইনপুট নয় — হিসাব হয়:
      //   Employee's Contribution = CPF Deduction − Employer's Contribution to CPF
      //   Company's Contribution  = Employer's Contribution to CPF
      //   মোট CPF (C = 1+2)       = CPF Deduction
      // (cpfEmp / cpfComp দুটি totals() থেকে আসা হিসাবকৃত মান)
      var CPF = [
        ['cpfEmp', "Employee's Contribution to CPF"], ['cpfComp', "Company's Contribution to CPF"]
      ];
      var ALL_FIELDS = EARN.concat(DEDUCT);
      var CPF_RULE_NOTE = "Employee = CPF Deduction − Employer's Contribution to CPF; Company = Employer's Contribution to CPF; মোট CPF = CPF Deduction।";

      var state = { data: null, sel: '', cpfYear: '', reqId: 0, loadedAt: 0, everLoaded: false };

      /* ---------- helpers ---------- */
      function el(id) { return document.getElementById(id); }
      function root() { return document.getElementById('page-power-grid'); }
      function getToken() { try { return localStorage.getItem(TOKEN_KEY); } catch (e) { return null; } }
      function esc(s) {
        return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }
      function bn(v) { return String(v).replace(/[0-9]/g, function (d) { return BN_DIGITS[Number(d)]; }); }
      function num(n) { return (Number(n) || 0).toLocaleString('en-US', { maximumFractionDigits: 2 }); }
      function money(n) { return '৳ ' + num(n); }
      function cell(n) { return Number(n) ? num(n) : '-'; }
      function monthTitle(key) {
        var p = String(key).split('-');
        return BN_MONTHS[Number(p[1]) - 1] + ', ' + bn(p[0]);
      }
      function dispShort(iso) {
        var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso || ''));
        return m ? m[3] + '/' + m[2] + '/' + m[1].slice(2) : '—';
      }
      function nowKey() {
        var parts = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Dhaka', year: 'numeric', month: '2-digit' }).formatToParts(new Date());
        var y = '', m = '';
        parts.forEach(function (p) { if (p.type === 'year') y = p.value; if (p.type === 'month') m = p.value; });
        return y + '-' + m;
      }
      function shiftKey(key, delta) {
        var p = key.split('-');
        var idx = Number(p[0]) * 12 + (Number(p[1]) - 1) + delta;
        return Math.floor(idx / 12) + '-' + ('0' + ((idx % 12) + 1)).slice(-2);
      }
      function call(fnName, args, ok, fail) {
        var runner = google.script.run
          .withSuccessHandler(ok || function () {})
          .withFailureHandler(function (err) {
            showToast((err && err.message) || 'কাজটি সম্পন্ন হয়নি।', 'danger');
            if (fail) fail(err);
          });
        runner[fnName].apply(runner, args);
      }
      function setBusy(b) {
        el('pgBody').classList.toggle('busy', !!b);
        el('pgCpfBody').classList.toggle('busy', !!b);
      }
      function showError(msg) {
        el('pgErrorText').textContent = msg;
        el('pgError').classList.add('show');
        if (!state.data) {
          el('pgCpfMonthly').innerHTML = '<div class="pg-empty">' + esc(msg) +
            ' <button type="button" class="pg-tag-btn" data-act="retry">আবার চেষ্টা করুন</button></div>';
        }
      }
      function hideError() { el('pgError').classList.remove('show'); }

      /* ---------- data helpers ---------- */
      function list() { return (state.data && state.data.statements) || []; }
      function findSt(key) {
        var l = list();
        for (var i = 0; i < l.length; i++) if (l[i].monthKey === key) return l[i];
        return null;
      }
      function selectedSt() {
        var s = findSt(state.sel);
        if (!s && list().length) { s = list()[list().length - 1]; state.sel = s.monthKey; }
        return s || null;
      }
      function sumOf(st, defs) {
        var t = 0;
        defs.forEach(function (d) { t += Number(st[d[0]]) || 0; });
        return t;
      }
      function totals(st) {
        if (!st) return { gross: 0, allow: 0, ded: 0, net: 0, cpfEmp: 0, cpfComp: 0, cpfTotal: 0 };
        var gross = sumOf(st, EARN);
        var ded = sumOf(st, DEDUCT);
        var cpfDed = Number(st.cpfDeduction) || 0;       // CPF Deduction = মোট CPF (Employee + Company)
        var comp = Number(st.employerCpfEarning) || 0;   // Company's contribution = Employer's Contribution to CPF
        var emp = Math.round((cpfDed - comp) * 100) / 100; // Employee's contribution = CPF Deduction − Employer's Contribution
        return {
          gross: gross,
          allow: gross - (Number(st.basic) || 0),
          ded: ded,
          net: gross - ded,
          cpfEmp: emp,
          cpfComp: comp,
          cpfTotal: emp + comp
        };
      }
      /** CPF সারির মানগুলো (হিসাবকৃত) — colHtml/reportTable এ st-এর মতো ব্যবহারের জন্য */
      function cpfView(t) { return { cpfEmp: t.cpfEmp, cpfComp: t.cpfComp }; }

      /* ---------- load ---------- */
      function load(cb) {
        var token = getToken();
        if (!token || typeof google === 'undefined' || !google.script || !google.script.run) return;

        var id = ++state.reqId;
        hideError();
        setBusy(true);

        google.script.run
          .withSuccessHandler(function (d) {
            if (id !== state.reqId) return;
            state.data = d;
            state.loadedAt = Date.now();
            state.everLoaded = true;
            setBusy(false);
            render();
            if (typeof cb === 'function') cb();
          })
          .withFailureHandler(function (err) {
            if (id !== state.reqId) return;
            setBusy(false);
            showError((err && err.message) || 'বেতনের তথ্য লোড করা যায়নি।');
          })
          .getPowerGridData(token);
      }

      function render() {
        if (!state.data) return;
        var st = selectedSt();
        var t = totals(st);
        renderTop(st, t);
        renderStatement(st, t);
        renderSummary(t);
        renderPrevList(st);
        renderCpfTab();
      }

      /* ---------- উপরের ৪টি কার্ড ---------- */
      var SVG = {
        wallet: '<svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h13v3"/><path d="M3 7v11a2 2 0 0 0 2 2h14a1 1 0 0 0 1-1V9a1 1 0 0 0-1-1H5a2 2 0 0 1-2-1z"/><circle cx="16.5" cy="14" r="1.2"/></svg>',
        coins: '<svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/><path d="M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg>',
        calc: '<svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01"/></svg>',
        hand: '<svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M12 5.5v3M10.8 6.4h2.2M10.8 8.4h2.4"/><path d="M3 17l4-2 4 1.5h4a1.5 1.5 0 0 1 0 3H10"/><path d="M15 17.5l4.5-2a1.5 1.5 0 0 1 1.5 2.6L14 21l-7-1.5-4 1"/></svg>',
        person: '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg>',
        building: '<svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="1"/><path d="M9 8h.01M15 8h.01M9 12h.01M15 12h.01M10 21v-4h4v4"/></svg>',
        calendar: '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>'
      };

      function kpi(cls, svg, label, value, kind) {
        return '<div class="pg-card pg-kpi"><div class="pg-kpi-ico ' + cls + '">' + svg + '</div>' +
          '<div><div class="pg-kpi-label">' + label + '</div><div class="pg-kpi-value">' + value + '</div>' +
          '<button type="button" class="pg-link" data-act="kpi" data-kind="' + kind + '">বিস্তারিত দেখুন →</button></div></div>';
      }

      function renderTop(st, t) {
        el('pgTop').innerHTML =
          kpi('pg-ico-blue', SVG.wallet, 'গ্রস সেলারি', money(t.gross), 'gross') +
          kpi('pg-ico-green', SVG.coins, 'মোট ভাতা', money(t.allow), 'allow') +
          kpi('pg-ico-red', SVG.calc, 'মোট কর্তন', money(t.ded), 'ded') +
          kpi('pg-ico-purple', SVG.hand, 'হাতে প্রাপ্ত বেতন', money(t.net), 'net') +
          '<button type="button" class="pg-add" data-act="add"><span style="font-size:26px;line-height:1">＋</span> নতুন বেতন এন্ট্রি</button>';
      }

      /* ---------- সেলারি স্টেটমেন্ট ---------- */
      function colHtml(cls, title, defs, st, footLabel, footValue) {
        var rows = '';
        for (var i = 0; i < Math.max(10, EARN.length); i++) {
          var d = defs[i];
          if (d) {
            rows += '<div class="pg-r"><span><span class="pg-n">' + (i + 1) + '</span></span><span title="' + esc(d[1]) + '">' + esc(d[1]) + '</span><span>' + cell(st ? st[d[0]] : 0) + '</span></div>';
          } else {
            rows += '<div class="pg-r"><span></span><span></span><span></span></div>';
          }
        }
        return '<div class="pg-col ' + cls + '"><div class="pg-col-h"><span>' + title + '</span><span>পরিমাণ (৳)</span></div>' + rows +
          '<div class="pg-col-f"><span>' + footLabel + '</span><span>' + num(footValue) + '</span></div></div>';
      }

      function renderStatement(st, t) {
        var d = state.data;
        var emp = d.employee || {};
        var keys = list().map(function (s) { return s.monthKey; });
        var idx = st ? keys.indexOf(st.monthKey) : -1;

        el('pgMonthLabel').textContent = st ? monthTitle(st.monthKey) : 'কোনো এন্ট্রি নেই';
        el('pgPrev').disabled = !(idx > 0);
        el('pgNext').disabled = !(idx >= 0 && idx < keys.length - 1);

        el('pgNotice').innerHTML = st ? '' :
          '<div class="pg-notice"><span>এখনো কোনো বেতন এন্ট্রি করা হয়নি।</span><button type="button" data-act="add">＋ প্রথম এন্ট্রি যোগ করুন</button></div>';

        el('pgEmp').innerHTML =
          '<button type="button" class="pg-emp-edit" data-act="edit-emp">✏️ তথ্য সম্পাদনা</button>' +
          '<div><div class="pg-emp-l">Employee ID</div><div class="pg-emp-v">' + esc(emp.employeeId || '—') + '</div></div>' +
          '<div><div class="pg-emp-l">Name of Employee</div><div class="pg-emp-v name">' + esc(emp.name || '—') + '</div></div>' +
          '<div><div class="pg-emp-l">Designation</div><div class="pg-emp-v">' + esc(emp.designation || '—') + '</div></div>' +
          '<div><div class="pg-emp-l">Joining Date</div><div class="pg-emp-v">' + dispShort(emp.joiningDate) + '</div></div>' +
          '<div><div class="pg-emp-l">Next Increment Date</div><div class="pg-emp-v">' + dispShort(emp.nextIncrementDate) + '</div></div>';

        el('pgCols').innerHTML =
          colHtml('pg-earn', 'আয়/ভাতা (Earnings)', EARN, st, 'মোট আয় (A)', t.gross) +
          colHtml('pg-ded', 'কর্তন (Deductions)', DEDUCT, st, 'মোট কর্তন (B)', t.ded) +
          colHtml('pg-cpf', 'CPF (Provident Fund)', CPF, st ? cpfView(t) : null, 'মোট CPF (C = 1+2)', t.cpfTotal);
      }

      /* ---------- সারাংশ ---------- */
      function renderSummary(t) {
        function item(label, value, cls) {
          return '<div class="pg-sum-item"><div class="pg-sum-l">' + label + '</div><div class="pg-sum-v ' + cls + '">' + num(value) + '</div></div>';
        }
        function op(s) { return '<div class="pg-sum-op">' + s + '</div>'; }
        el('pgSummary').innerHTML =
          item('গ্রস সেলারি<br>(A)', t.gross, 'c-blue') + op('−') +
          item('মোট কর্তন<br>(B)', t.ded, 'c-red') + op('=') +
          item('হাতে প্রাপ্ত বেতন<br>(A − B)', t.net, 'c-green');
      }

      /* ---------- পূর্বের স্টেটমেন্ট ---------- */
      var EYE = '<svg viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
      var ICON_EDIT = '<svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
      var ICON_DEL = '<svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/><path d="M10 11v6M14 11v6"/></svg>';

      function summaryRow(s, actions) {
        var t = totals(s);
        return '<tr' + (s.monthKey === state.sel ? ' class="cur"' : '') + '><td>' + monthTitle(s.monthKey) + '</td><td>' + num(t.gross) + '</td><td>' + num(t.ded) +
          '</td><td>' + num(t.net) + '</td><td>' + num(t.cpfEmp) + '</td><td>' + num(t.cpfComp) + '</td><td>' + num(t.cpfTotal) + '</td><td>' + actions + '</td></tr>';
      }
      var PREV_HEAD = '<thead><tr><th style="text-align:left">মাস, বছর</th><th>গ্রস সেলারি (৳)</th><th>মোট কর্তন (৳)</th><th>হাতে প্রাপ্ত বেতন (৳)</th>' +
        '<th>Employee CPF (৳)</th><th>Company CPF (৳)</th><th>মোট CPF (৳)</th><th>অ্যাকশন</th></tr></thead>';

      function renderPrevList(st) {
        var host = el('pgPrevList');
        var before = list().filter(function (s) { return !st || s.monthKey < st.monthKey; }).slice(-4).reverse();
        if (!before.length) {
          host.innerHTML = '<div class="pg-empty">আগের কোনো বেতন স্টেটমেন্ট নেই।</div>' +
            (list().length ? '<button type="button" class="pg-more" data-act="all">সব বেতন স্টেটমেন্ট দেখুন →</button>' : '');
          return;
        }
        host.innerHTML = '<div class="pg-table-wrap"><table class="pg-table">' + PREV_HEAD + '<tbody>' +
          before.map(function (s) {
            return summaryRow(s, '<button type="button" class="pg-iconbtn" data-act="view" data-key="' + esc(s.monthKey) + '" title="দেখুন">' + EYE + '</button>');
          }).join('') + '</tbody></table></div>' +
          '<button type="button" class="pg-more" data-act="all">সব বেতন স্টেটমেন্ট দেখুন →</button>';
      }

      /* ---------- CPF (স্টেটমেন্ট + পূর্বের এন্ট্রি) ---------- */
      function yearStatements(year) {
        return list().filter(function (s) { return s.monthKey.substring(0, 4) === String(year); });
      }
      function selectedYear() {
        var st = selectedSt();
        return st ? st.monthKey.substring(0, 4) : nowKey().substring(0, 4);
      }

      /** প্রতি মাসে একটি রেকর্ড: স্টেটমেন্ট থাকলে সেখান থেকে, না থাকলে CPF ইতিহাস থেকে (পুরনো মাস আগে)। */
      function cpfRecords() {
        var map = {};
        ((state.data && state.data.cpfHistory) || []).forEach(function (h) {
          map[h.monthKey] = { monthKey: h.monthKey, emp: Number(h.employeeCpf) || 0, comp: Number(h.companyCpf) || 0, source: 'history', id: h.id, notes: h.notes };
        });
        list().forEach(function (s) {
          var t = totals(s);
          map[s.monthKey] = { monthKey: s.monthKey, emp: t.cpfEmp, comp: t.cpfComp, source: 'statement' };
        });
        return Object.keys(map).sort().map(function (k) { return map[k]; });
      }
      function cpfYearRecords(year) {
        return cpfRecords().filter(function (r) { return r.monthKey.substring(0, 4) === String(year); });
      }

      /** ডোনাট + লেজেন্ড (Employee বনাম Company); মোট ০ হলে ফাঁকা স্ট্রিং। */
      function donutHtml(emp, comp) {
        var total = emp + comp;
        if (total <= 0) return '';

        var r = 52, c = 2 * Math.PI * r;
        var eLen = Math.max(0, emp) / total * c;
        var svg = '<svg viewBox="0 0 140 140" role="img" aria-label="CPF অনুপাত">' +
          '<circle cx="70" cy="70" r="' + r + '" fill="none" stroke="#1d4ed8" stroke-width="22"/>' +
          (emp > 0 ? '<circle cx="70" cy="70" r="' + r + '" fill="none" stroke="#15803d" stroke-width="22" stroke-dasharray="' + eLen + ' ' + (c - eLen) + '" transform="rotate(-90 70 70)"/>' : '') +
          '<text x="70" y="65" text-anchor="middle" font-size="10.5" fill="#475569">মোট CPF</text>' +
          '<text x="70" y="82" text-anchor="middle" font-size="13" font-weight="800" fill="#10233F">৳ ' + num(total) + '</text></svg>';

        return '<div class="pg-donut-wrap"><div class="pg-donut">' + svg + '</div><div class="pg-legend">' +
          '<div class="pg-lg"><i style="background:#15803d"></i><div>Employee\'s CPF<small>' + (emp / total * 100).toFixed(1) + '% (৳ ' + num(emp) + ')</small></div></div>' +
          '<div class="pg-lg"><i style="background:#1d4ed8"></i><div>Company\'s CPF<small>' + (comp / total * 100).toFixed(1) + '% (৳ ' + num(comp) + ')</small></div></div>' +
          '</div></div>';
      }

      /* =====================================================
         ট্যাব: CPF হিসাব
         ===================================================== */
      function cpfYearList() {
        var seen = {}, out = [];
        cpfRecords().forEach(function (r) {
          var y = r.monthKey.substring(0, 4);
          if (!seen[y]) { seen[y] = true; out.push(y); }
        });
        var cur = nowKey().substring(0, 4);
        if (!seen[cur]) out.push(cur);
        out.sort();
        return out;
      }

      /** ক্রমযোজিত মোট (সব বছর মিলিয়ে) — মাসের কী → সেই মাস পর্যন্ত মোট CPF */
      function cpfCumulative() {
        var run = 0, map = {};
        cpfRecords().forEach(function (r) { run += r.emp + r.comp; map[r.monthKey] = run; });
        return map;
      }

      function niceMax(v) {
        if (v <= 0) return 1000;
        var p = Math.pow(10, Math.floor(Math.log(v) / Math.LN10));
        var f = v / p;
        var nf = f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10;
        return nf * p;
      }

      function cpfChartHtml(year, byKey) {
        var vals = [], maxVal = 0, m;
        for (m = 1; m <= 12; m++) {
          var r = byKey[year + '-' + ('0' + m).slice(-2)];
          var e = r ? r.emp : 0, c = r ? r.comp : 0;
          vals.push([e, c]);
          maxVal = Math.max(maxVal, e, c);
        }
        if (maxVal <= 0) return '<div class="pg-empty">এই বছরে চার্ট দেখানোর মতো CPF এন্ট্রি নেই।</div>';

        var max = niceMax(maxVal);
        var W = 560, H = 250, L = 64, R = 8, T = 10, B = 30;
        var pw = W - L - R, ph = H - T - B;
        var gw = pw / 12;
        var bw = Math.min(16, gw * 0.32);
        var gap = 3;
        var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="মাসভিত্তিক CPF চার্ট">';

        for (var g = 0; g <= 4; g++) {
          var y = T + ph - (ph * g / 4);
          svg += '<line x1="' + L + '" y1="' + y + '" x2="' + (W - R) + '" y2="' + y + '" stroke="#e5e9f0" stroke-width="1"/>';
          svg += '<text x="' + (L - 8) + '" y="' + (y + 4) + '" text-anchor="end" font-size="11" fill="#64748b">' + num(max * g / 4) + '</text>';
        }

        vals.forEach(function (v, i) {
          var gx = L + gw * i + gw / 2;
          var startX = gx - (bw * 2 + gap) / 2;
          [[v[0], '#15803d', "Employee's CPF"], [v[1], '#1d4ed8', "Company's CPF"]].forEach(function (s, k) {
            var h = ph * s[0] / max;
            svg += '<rect x="' + (startX + k * (bw + gap)) + '" y="' + (T + ph - h) + '" width="' + bw + '" height="' + h + '" rx="2" fill="' + s[1] + '"><title>' +
              esc(BN_MONTHS[i] + ' — ' + s[2] + ': ' + money(s[0])) + '</title></rect>';
          });
          svg += '<text x="' + gx + '" y="' + (H - 10) + '" text-anchor="middle" font-size="11" fill="#334155">' + BN_MONTHS_SHORT[i] + '</text>';
        });

        return '<div class="pg-chart-legend"><span><i style="background:#15803d"></i>Employee\'s CPF</span><span><i style="background:#1d4ed8"></i>Company\'s CPF</span></div>' + svg + '</svg>';
      }

      function cpfKpi(cls, svg, label, value, sub) {
        return '<div class="pg-card pg-kpi"><div class="pg-kpi-ico ' + cls + '">' + svg + '</div>' +
          '<div><div class="pg-kpi-label">' + label + '</div><div class="pg-kpi-value">' + value + '</div>' +
          '<div class="pg-kpi-sub">' + sub + '</div></div></div>';
      }

      function cpfSourceCell(r, key) {
        if (r.source === 'statement') {
          return '<span class="pg-src"><span class="pg-tag st">বেতন স্টেটমেন্ট</span>' +
            '<button type="button" class="pg-iconbtn" data-act="cpf-open-st" data-key="' + esc(key) + '" title="বেতন স্টেটমেন্ট সম্পাদনা">' + ICON_EDIT + '</button></span>';
        }
        return '<span class="pg-src"><span class="pg-tag hist">পূর্বের এন্ট্রি</span>' +
          '<button type="button" class="pg-iconbtn" data-act="cpf-edit" data-id="' + esc(r.id) + '" title="সম্পাদনা">' + ICON_EDIT + '</button>' +
          '<button type="button" class="pg-iconbtn del" data-act="cpf-del" data-id="' + esc(r.id) + '" title="মুছুন">' + ICON_DEL + '</button></span>';
      }

      function renderCpfTab() {
        if (!state.data) return;

        var years = cpfYearList();
        if (!state.cpfYear || years.indexOf(state.cpfYear) < 0) {
          var sy = selectedYear();
          state.cpfYear = years.indexOf(sy) >= 0 ? sy : years[years.length - 1];
        }
        var year = state.cpfYear;
        var yIdx = years.indexOf(year);

        var recs = cpfRecords();
        var cum = cpfCumulative();
        var byKey = {};
        recs.forEach(function (r) { byKey[r.monthKey] = r; });

        var allEmp = 0, allComp = 0;
        recs.forEach(function (r) { allEmp += r.emp; allComp += r.comp; });
        var yEmp = 0, yComp = 0, yCount = 0;
        cpfYearRecords(year).forEach(function (r) { yEmp += r.emp; yComp += r.comp; yCount++; });

        /* উপরের কার্ড */
        el('pgCpfTop').innerHTML =
          cpfKpi('pg-ico-purple', SVG.coins, 'সর্বমোট CPF জমা', money(allEmp + allComp), bn(recs.length) + ' মাসের এন্ট্রি (সব বছর)') +
          cpfKpi('pg-ico-green', SVG.person, "Employee's CPF (সব বছর)", money(allEmp), 'কর্মচারীর অংশ') +
          cpfKpi('pg-ico-blue', SVG.building, "Company's CPF (সব বছর)", money(allComp), 'প্রতিষ্ঠানের অংশ') +
          cpfKpi('pg-ico-amber', SVG.calendar, bn(year) + ' সালের CPF', money(yEmp + yComp), bn(yCount) + ' মাসের এন্ট্রি') +
          '<button type="button" class="pg-add" data-act="cpf-add"><span style="font-size:26px;line-height:1">＋</span> নতুন CPF এন্ট্রি</button>';

        /* বছর বদল */
        el('pgCpfYearLabel').textContent = bn(year);
        el('pgCpfPrev').disabled = !(yIdx > 0);
        el('pgCpfNext').disabled = !(yIdx >= 0 && yIdx < years.length - 1);

        /* চার্ট */
        el('pgCpfChart').innerHTML = cpfChartHtml(year, byKey);

        /* মাসিক তালিকা — ১২টি মাসই দেখানো হয়, এন্ট্রি না থাকলে "যোগ করুন" বাটন */
        var rows = '', m;
        for (m = 1; m <= 12; m++) {
          var key = year + '-' + ('0' + m).slice(-2);
          var r = byKey[key];
          if (r) {
            rows += '<tr><td>' + BN_MONTHS[m - 1] + '</td><td>' + num(r.emp) + '</td><td>' + num(r.comp) + '</td><td>' + num(r.emp + r.comp) +
              '</td><td>' + num(cum[key]) + '</td><td>' + cpfSourceCell(r, key) + '</td></tr>';
          } else {
            rows += '<tr class="pg-miss"><td>' + BN_MONTHS[m - 1] + '</td><td>-</td><td>-</td><td>-</td><td>-</td>' +
              '<td><button type="button" class="pg-tag-btn" data-act="cpf-add-month" data-key="' + key + '">＋ এন্ট্রি যোগ</button></td></tr>';
          }
        }
        el('pgCpfMonthly').innerHTML = '<div class="pg-table-wrap"><table class="pg-table"><thead><tr>' +
          '<th style="text-align:left">মাস</th><th>Employee CPF (৳)</th><th>Company CPF (৳)</th><th>মোট CPF (৳)</th><th>ক্রমযোজিত মোট (৳)</th><th>উৎস / অ্যাকশন</th></tr></thead><tbody>' +
          rows + '</tbody><tfoot><tr><td>' + bn(year) + ' সালের মোট</td><td>' + num(yEmp) + '</td><td>' + num(yComp) + '</td><td>' + num(yEmp + yComp) + '</td><td></td><td></td></tr></tfoot></table></div>';

        /* বছরভিত্তিক সারাংশ */
        var agg = {};
        recs.forEach(function (r) {
          var y = r.monthKey.substring(0, 4);
          var a = agg[y] || (agg[y] = { emp: 0, comp: 0, count: 0, lastKey: '' });
          a.emp += r.emp; a.comp += r.comp; a.count++; a.lastKey = r.monthKey;
        });
        var yearKeys = Object.keys(agg).sort().reverse();
        if (!yearKeys.length) {
          el('pgCpfYears').innerHTML = '<div class="pg-empty">এখনো কোনো CPF এন্ট্রি নেই। উপরের "নতুন CPF এন্ট্রি" বাটন বা বেতন এন্ট্রি দিয়ে শুরু করুন।</div>';
        } else {
          var yrows = yearKeys.map(function (y) {
            var a = agg[y];
            return '<tr class="pg-year-row' + (y === year ? ' cur' : '') + '" data-act="cpf-year" data-year="' + y + '"><td>' + bn(y) + '</td><td>' + bn(a.count) + '</td><td>' +
              num(a.emp) + '</td><td>' + num(a.comp) + '</td><td>' + num(a.emp + a.comp) + '</td><td>' + num(cum[a.lastKey]) + '</td></tr>';
          }).join('');
          el('pgCpfYears').innerHTML = '<div class="pg-table-wrap"><table class="pg-table"><thead><tr>' +
            '<th style="text-align:left">বছর</th><th>এন্ট্রি (মাস)</th><th>Employee CPF (৳)</th><th>Company CPF (৳)</th><th>মোট CPF (৳)</th><th>বছর শেষে ক্রমযোজিত (৳)</th></tr></thead><tbody>' +
            yrows + '</tbody><tfoot><tr><td>সর্বমোট</td><td>' + bn(recs.length) + '</td><td>' + num(allEmp) + '</td><td>' + num(allComp) + '</td><td>' + num(allEmp + allComp) + '</td><td></td></tr></tfoot></table></div>' +
            '<div class="pg-m-note" style="margin-top:8px">কোনো বছরের সারিতে ক্লিক করলে ওপরের মাসিক তালিকা সেই বছরে চলে যাবে।</div>';
        }

        /* ডান কলাম: নির্বাচিত বছরের অনুপাত */
        el('pgCpfSideYear').textContent = bn(year);
        var side =
          '<div class="pg-cpf-row"><span>Employee\'s CPF</span><b>৳ ' + num(yEmp) + '</b></div>' +
          '<div class="pg-cpf-row"><span>Company\'s CPF</span><b>৳ ' + num(yComp) + '</b></div>' +
          '<div class="pg-cpf-row"><span>মোট CPF</span><b>৳ ' + num(yEmp + yComp) + '</b></div>';
        var donut = donutHtml(yEmp, yComp);
        el('pgCpfSide').innerHTML = side + (donut || '<div class="pg-empty">এই বছরে CPF এন্ট্রি নেই।</div>');
      }

      /** নির্বাচিত বছরের প্রথম যে মাসে CPF রেকর্ড নেই ('yyyy-MM'); সব মাসে থাকলে ফাঁকা। */
      function firstFreeCpfMonth(year) {
        if (!year) return '';
        var taken = {};
        cpfRecords().forEach(function (r) { taken[r.monthKey] = true; });
        for (var m = 1; m <= 12; m++) {
          var key = year + '-' + ('0' + m).slice(-2);
          if (!taken[key]) return key;
        }
        return '';
      }

      function stepCpfYear(dir) {
        var years = cpfYearList();
        var i = years.indexOf(state.cpfYear) + dir;
        if (i < 0 || i >= years.length) return;
        state.cpfYear = years[i];
        renderCpfTab();
      }

      /* =====================================================
         মোডাল: কার্ডের বিস্তারিত
         ===================================================== */
      function detailRows(defs, st) {
        return defs.map(function (d) {
          return '<div class="pg-m-row"><span>' + esc(d[1]) + '</span><b>' + cell(st[d[0]]) + '</b></div>';
        }).join('');
      }

      function openKpiDetail(kind) {
        var st = selectedSt();
        if (!st) { showToast('আগে একটি বেতন এন্ট্রি করুন।', 'warning'); return; }
        var t = totals(st);
        var body, title;
        if (kind === 'gross') {
          title = 'গ্রস সেলারি';
          body = detailRows(EARN, st) + '<div class="pg-m-row total"><span>মোট আয় (A)</span><b>' + money(t.gross) + '</b></div>';
        } else if (kind === 'allow') {
          title = 'মোট ভাতা';
          body = detailRows(EARN.slice(1), st) + '<div class="pg-m-row total"><span>মোট ভাতা (মূল বেতন বাদে)</span><b>' + money(t.allow) + '</b></div>';
        } else if (kind === 'ded') {
          title = 'মোট কর্তন';
          body = detailRows(DEDUCT, st) + '<div class="pg-m-row total"><span>মোট কর্তন (B)</span><b>' + money(t.ded) + '</b></div>';
        } else {
          title = 'হাতে প্রাপ্ত বেতন';
          body = '<div class="pg-m-row"><span>গ্রস সেলারি (A)</span><b>' + money(t.gross) + '</b></div>' +
            '<div class="pg-m-row"><span>মোট কর্তন (B)</span><b>− ' + money(t.ded) + '</b></div>' +
            '<div class="pg-m-row total"><span>হাতে প্রাপ্ত বেতন (A − B)</span><b>' + money(t.net) + '</b></div>';
        }
        showModal(title + ' — ' + monthTitle(st.monthKey), body, [{ label: 'বন্ধ করুন', className: 'btn-outline', onClick: hideModal }]);
        el('modalBody').onclick = null;
      }

      /* =====================================================
         মোডাল: সব স্টেটমেন্ট
         ===================================================== */
      function openAllModal() {
        var rows = list().slice().reverse();
        var body = rows.length
          ? '<div style="overflow-x:auto"><table class="pg-m-table"><thead><tr><th>মাস</th><th>গ্রস</th><th>কর্তন</th><th>নিট</th><th>মোট CPF</th><th></th></tr></thead><tbody>' +
            rows.map(function (s) {
              var t = totals(s);
              return '<tr><td>' + monthTitle(s.monthKey) + '</td><td>' + num(t.gross) + '</td><td>' + num(t.ded) + '</td><td>' + num(t.net) + '</td><td>' + num(t.cpfTotal) + '</td>' +
                '<td><button type="button" class="pg-m-mini" data-m-view="' + esc(s.monthKey) + '">দেখুন</button> ' +
                '<button type="button" class="pg-m-mini" data-m-edit="' + esc(s.monthKey) + '">সম্পাদনা</button> ' +
                '<button type="button" class="pg-m-mini danger" data-m-del="' + esc(s.monthKey) + '">মুছুন</button></td></tr>';
            }).join('') + '</tbody></table></div>'
          : '<div class="pg-empty">কোনো বেতন স্টেটমেন্ট নেই।</div>';

        showModal('সব বেতন স্টেটমেন্ট', body, [
          { label: 'বন্ধ করুন', className: 'btn-outline', onClick: hideModal },
          { label: '＋ নতুন বেতন এন্ট্রি', className: 'btn-primary', onClick: function () { openEntryModal(''); } }
        ]);
        setModalWide(true);

        el('modalBody').onclick = function (e) {
          var v = e.target.closest('[data-m-view]');
          if (v) { state.sel = v.getAttribute('data-m-view'); hideModal(); render(); scrollTop(); return; }
          var ed = e.target.closest('[data-m-edit]');
          if (ed) { openEntryModal(ed.getAttribute('data-m-edit')); return; }
          var dl = e.target.closest('[data-m-del]');
          if (dl) confirmDeleteStatement(dl.getAttribute('data-m-del'));
        };
      }

      function scrollTop() {
        var top = el('pgTop');
        if (top && top.scrollIntoView) top.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }

      function confirmDeleteStatement(key) {
        confirmDialog(esc(monthTitle(key)) + ' মাসের বেতন স্টেটমেন্টটি মুছে ফেলবেন?', function () {
          call('deletePowerGridStatement', [getToken(), key], function () {
            showToast('স্টেটমেন্ট মুছে ফেলা হয়েছে।', 'success');
            if (state.sel === key) state.sel = '';
            load();
          });
        });
      }

      /* =====================================================
         মোডাল: বেতন এন্ট্রি (নতুন / সম্পাদনা)
         ===================================================== */
      function setModalWide(on) {
        var box = document.querySelector('#modalOverlay .modal-box');
        if (box) box.style.width = on ? '700px' : '';
      }

      // মোডাল বন্ধ হলে প্রস্থ আগের অবস্থায় ফেরানো
      (function watchModal() {
        var overlay = document.getElementById('modalOverlay');
        if (!overlay || !window.MutationObserver) return;
        new MutationObserver(function () {
          if (!overlay.classList.contains('open')) setModalWide(false);
        }).observe(overlay, { attributes: true, attributeFilter: ['class'] });
      })();

      function fieldInputs(defs) {
        return defs.map(function (d) {
          return '<div class="form-row"><label>' + esc(d[1]) + '</label><input type="number" min="0" step="any" class="form-input" id="pgf_' + d[0] + '"></div>';
        }).join('');
      }

      function nextMonthKey() {
        var l = list();
        return l.length ? shiftKey(l[l.length - 1].monthKey, 1) : nowKey();
      }

      function openEntryModal(editKey) {
        var edit = editKey ? findSt(editKey) : null;
        var latest = list().length ? list()[list().length - 1] : null;
        var base = edit || latest || {};
        var monthVal = edit ? edit.monthKey : nextMonthKey();

        var body =
          '<div class="form-row"><label>মাস *</label><input type="month" class="form-input" id="pgfMonth" value="' + esc(monthVal) + '"' + (edit ? ' disabled' : '') + '></div>' +
          (edit ? '' : '<div class="pg-m-note">' + (latest ? 'সর্বশেষ স্টেটমেন্টের মান বসানো আছে — প্রয়োজনে বদলান।' : 'ফাঁকা ঘর ০ ধরা হবে।') + '</div>') +
          '<div class="pg-m-sec earn">আয়/ভাতা (Earnings)</div><div class="form-grid">' + fieldInputs(EARN) + '</div>' +
          '<div class="pg-m-sec ded">কর্তন (Deductions)</div><div class="form-grid">' + fieldInputs(DEDUCT) + '</div>' +
          '<div class="pg-m-note">CPF অংশ নিজে থেকে আসে: ' + esc(CPF_RULE_NOTE) + '</div>' +
          '<div class="form-row" style="margin-top:12px"><label>নোট (ঐচ্ছিক)</label><textarea class="form-input" id="pgfNotes" rows="2"></textarea></div>' +
          '<div class="pg-m-live" id="pgfLive"></div>';

        showModal(edit ? 'বেতন এন্ট্রি সম্পাদনা — ' + monthTitle(edit.monthKey) : 'নতুন বেতন এন্ট্রি', body, [
          { label: 'বাতিল', className: 'btn-outline', onClick: hideModal },
          { label: 'সংরক্ষণ করুন', className: 'btn-primary', onClick: function () { submitEntry(edit); } }
        ]);
        setModalWide(true);
        el('modalBody').onclick = null;

        ALL_FIELDS.forEach(function (d) {
          var v = base[d[0]];
          el('pgf_' + d[0]).value = (v === undefined || v === null || Number(v) === 0) ? '' : v;
        });
        el('pgfNotes').value = edit ? (edit.notes || '') : '';

        el('modalBody').addEventListener('input', updateLive);
        updateLive();
      }

      function formValues() {
        var st = {};
        ALL_FIELDS.forEach(function (d) { st[d[0]] = el('pgf_' + d[0]).value; });
        return st;
      }

      function updateLive() {
        var host = el('pgfLive');
        if (!host) return;
        var t = totals(formValues());
        host.innerHTML = '<span class="c-blue">গ্রস: ' + money(t.gross) + '</span><span class="c-red">কর্তন: ' + money(t.ded) +
          '</span><span class="c-green">নিট: ' + money(t.net) + '</span><span class="c-purple">মোট CPF: ' + money(t.cpfTotal) + '</span>' +
          '<span class="c-dark">Employee CPF: ' + money(t.cpfEmp) + '</span>' +
          (t.cpfEmp < 0 ? '<span class="c-red">⚠️ CPF Deduction, Employer\'s Contribution-এর চেয়ে কম</span>' : '');
      }

      function submitEntry(edit) {
        var monthKey = edit ? edit.monthKey : el('pgfMonth').value;
        if (!/^\d{4}-\d{2}$/.test(monthKey)) { showToast('সঠিক মাস নির্বাচন করুন।', 'warning'); return; }

        var st = formValues();
        st.monthKey = monthKey;
        st.notes = el('pgfNotes').value;

        var hasAny = ALL_FIELDS.some(function (d) { return Number(st[d[0]]) > 0; });
        if (!hasAny) { showToast('অন্তত একটি পরিমাণ লিখুন।', 'warning'); return; }

        // Employee's CPF = CPF Deduction − Employer's Contribution; ঋণাত্মক হলে তথ্যে ভুল আছে
        if (totals(st).cpfEmp < 0) {
          showToast("CPF Deduction, Employer's Contribution to CPF-এর চেয়ে কম হতে পারে না।", 'warning');
          return;
        }

        function send() {
          call('savePowerGridStatement', [getToken(), st], function (key) {
            hideModal();
            showToast('বেতন এন্ট্রি সংরক্ষণ হয়েছে।', 'success');
            state.sel = key || monthKey;
            load();
          });
        }

        if (!edit && findSt(monthKey)) {
          confirmDialog(esc(monthTitle(monthKey)) + ' মাসের এন্ট্রি আগে থেকেই আছে। নতুন তথ্য দিয়ে বদলে দেবেন?', send);
        } else {
          send();
        }
      }

      /* =====================================================
         মোডাল: CPF এন্ট্রি তালিকা ও সম্পাদনা (পূর্বের কন্ট্রিবিউশন)
         ===================================================== */
      function openCpfListModal() {
        var recs = cpfRecords().slice().reverse();
        var shadowed = ((state.data && state.data.cpfHistory) || []).filter(function (h) { return !!findSt(h.monthKey); });
        var totE = 0, totC = 0;

        var rows = recs.map(function (r) {
          totE += r.emp; totC += r.comp;
          var actions = r.source === 'statement'
            ? '<button type="button" class="pg-m-mini" data-c-st="' + esc(r.monthKey) + '">সম্পাদনা</button>'
            : '<button type="button" class="pg-m-mini" data-c-edit="' + esc(r.id) + '">সম্পাদনা</button> ' +
              '<button type="button" class="pg-m-mini danger" data-c-del="' + esc(r.id) + '">মুছুন</button>';
          var tag = r.source === 'statement' ? '<span class="pg-m-tag">বেতন স্টেটমেন্ট</span>' : '<span class="pg-m-tag hist">পূর্বের এন্ট্রি</span>';
          return '<tr><td>' + monthTitle(r.monthKey) + '</td><td>' + num(r.emp) + '</td><td>' + num(r.comp) + '</td><td>' + num(r.emp + r.comp) + '</td><td>' + tag + '</td><td>' + actions + '</td></tr>';
        }).join('');

        shadowed.forEach(function (h) {
          rows += '<tr style="opacity:.55"><td>' + monthTitle(h.monthKey) + '</td><td>' + num(h.employeeCpf) + '</td><td>' + num(h.companyCpf) + '</td><td>' + num((Number(h.employeeCpf) || 0) + (Number(h.companyCpf) || 0)) + '</td>' +
            '<td><span class="pg-m-tag dim">গণনায় নেই (স্টেটমেন্ট আছে)</span></td><td><button type="button" class="pg-m-mini danger" data-c-del="' + esc(h.id) + '">মুছুন</button></td></tr>';
        });

        var body = (rows
          ? '<div style="overflow-x:auto"><table class="pg-m-table"><thead><tr><th>মাস</th><th>Employee</th><th>Company</th><th>মোট</th><th>উৎস</th><th></th></tr></thead><tbody>' + rows +
            '</tbody><tfoot><tr><td><b>সর্বমোট</b></td><td><b>' + num(totE) + '</b></td><td><b>' + num(totC) + '</b></td><td><b>' + num(totE + totC) + '</b></td><td></td><td></td></tr></tfoot></table></div>'
          : '<div class="pg-empty">এখনো কোনো CPF এন্ট্রি নেই।</div>') +
          '<div class="pg-m-note">যে মাসের বেতন স্টেটমেন্ট আছে, তার CPF সেখান থেকেই আসে (' + esc(CPF_RULE_NOTE) + ') স্টেটমেন্ট নেই এমন পুরনো মাসের CPF এখানে "নতুন CPF এন্ট্রি" দিয়ে যোগ করুন।</div>';

        showModal('CPF এন্ট্রিসমূহ', body, [
          { label: 'বন্ধ করুন', className: 'btn-outline', onClick: hideModal },
          { label: '＋ নতুন CPF এন্ট্রি', className: 'btn-primary', onClick: function () { openCpfEntryModal('', '', true); } }
        ]);
        setModalWide(true);

        el('modalBody').onclick = function (e) {
          var st = e.target.closest('[data-c-st]');
          if (st) { openEntryModal(st.getAttribute('data-c-st')); return; }
          var ed = e.target.closest('[data-c-edit]');
          if (ed) { openCpfEntryModal(ed.getAttribute('data-c-edit'), '', true); return; }
          var dl = e.target.closest('[data-c-del]');
          if (dl) confirmDeleteCpf(dl.getAttribute('data-c-del'), true);
        };
      }

      function findCpfEntry(id) {
        var l = (state.data && state.data.cpfHistory) || [];
        for (var i = 0; i < l.length; i++) if (l[i].id === id) return l[i];
        return null;
      }

      /** returnToList = true হলে (তালিকা মোডাল থেকে এলে) কাজ শেষে আবার তালিকা মোডাল খোলে; নইলে শুধু বন্ধ হয়। */
      function confirmDeleteCpf(id, returnToList) {
        var h = findCpfEntry(id);
        if (!h) return;
        confirmDialog(esc(monthTitle(h.monthKey)) + ' মাসের CPF এন্ট্রিটি মুছে ফেলবেন?', function () {
          call('deletePowerGridCpfEntry', [getToken(), id], function () {
            showToast('CPF এন্ট্রি মুছে ফেলা হয়েছে।', 'success');
            load(returnToList ? openCpfListModal : null);
          });
        });
      }

      /** presetMonth = নতুন এন্ট্রির জন্য আগে থেকে বসানো মাস ('yyyy-MM'), ফাঁকা হতে পারে। */
      function openCpfEntryModal(id, presetMonth, returnToList) {
        var edit = id ? findCpfEntry(id) : null;
        var monthVal = edit ? edit.monthKey : (presetMonth || '');
        var body =
          '<div class="form-row"><label>মাস *</label><input type="month" class="form-input" id="pgcMonth" value="' + esc(monthVal) + '"' + (edit ? ' disabled' : '') + '></div>' +
          '<div class="form-grid">' +
            '<div class="form-row"><label>Employee\'s Contribution to CPF</label><input type="number" min="0" step="any" class="form-input" id="pgcEmp" value="' + esc(edit && edit.employeeCpf ? edit.employeeCpf : '') + '"></div>' +
            '<div class="form-row"><label>Company\'s Contribution to CPF</label><input type="number" min="0" step="any" class="form-input" id="pgcComp" value="' + esc(edit && edit.companyCpf ? edit.companyCpf : '') + '"></div>' +
          '</div>' +
          '<div class="form-row"><label>নোট (ঐচ্ছিক)</label><textarea class="form-input" id="pgcNotes" rows="2">' + esc(edit ? edit.notes : '') + '</textarea></div>' +
          '<div class="pg-m-note">এটি শুধু সেই মাসের জন্য, যার বেতন স্টেটমেন্ট এখানে নেই।</div>';

        showModal(edit ? 'CPF এন্ট্রি সম্পাদনা — ' + monthTitle(edit.monthKey) : 'নতুন CPF এন্ট্রি', body, [
          { label: 'বাতিল', className: 'btn-outline', onClick: returnToList ? openCpfListModal : hideModal },
          { label: 'সংরক্ষণ করুন', className: 'btn-primary', onClick: function () { submitCpfEntry(edit, returnToList); } }
        ]);
        setModalWide(false);
        el('modalBody').onclick = null;
      }

      function submitCpfEntry(edit, returnToList) {
        var monthKey = edit ? edit.monthKey : el('pgcMonth').value;
        if (!/^\d{4}-\d{2}$/.test(monthKey)) { showToast('সঠিক মাস নির্বাচন করুন।', 'warning'); return; }
        var emp = Number(el('pgcEmp').value) || 0;
        var comp = Number(el('pgcComp').value) || 0;
        if (emp + comp <= 0) { showToast('অন্তত একটি CPF পরিমাণ লিখুন।', 'warning'); return; }
        if (!edit && findSt(monthKey)) { showToast('এই মাসের বেতন স্টেটমেন্ট আছে — CPF সেখান থেকেই আসে।', 'warning'); return; }

        call('savePowerGridCpfEntry', [getToken(), {
          id: edit ? edit.id : '', monthKey: monthKey, employeeCpf: emp, companyCpf: comp, notes: el('pgcNotes').value
        }], function () {
          showToast('CPF এন্ট্রি সংরক্ষণ হয়েছে।', 'success');
          if (returnToList) {
            load(openCpfListModal);
          } else {
            hideModal();
            // নতুন এন্ট্রি যে বছরের, ট্যাব সেই বছরেই খুলুক
            state.cpfYear = monthKey.substring(0, 4);
            load();
          }
        });
      }

      /* =====================================================
         মোডাল: কর্মচারীর তথ্য
         ===================================================== */
      function openEmpModal() {
        var e = (state.data && state.data.employee) || {};
        var body =
          '<div class="form-row"><label>Employee ID</label><input type="text" class="form-input" id="pgeId" value="' + esc(e.employeeId) + '"></div>' +
          '<div class="form-row"><label>Designation</label><input type="text" class="form-input" id="pgeDesig" value="' + esc(e.designation) + '"></div>' +
          '<div class="form-grid">' +
            '<div class="form-row"><label>Joining Date</label><input type="date" class="form-input" id="pgeJoin" value="' + esc(e.joiningDate) + '"></div>' +
            '<div class="form-row"><label>Next Increment Date</label><input type="date" class="form-input" id="pgeInc" value="' + esc(e.nextIncrementDate) + '"></div>' +
          '</div>' +
          '<div class="pg-m-note">নাম ব্যক্তিগত তথ্য পেজের প্রোফাইল (English নাম) থেকে আসে।</div>';

        showModal('কর্মচারীর তথ্য সম্পাদনা', body, [
          { label: 'বাতিল', className: 'btn-outline', onClick: hideModal },
          { label: 'সংরক্ষণ করুন', className: 'btn-primary', onClick: function () {
              call('savePowerGridEmployee', [getToken(), {
                employeeId: el('pgeId').value, designation: el('pgeDesig').value,
                joiningDate: el('pgeJoin').value, nextIncrementDate: el('pgeInc').value
              }], function () {
                hideModal();
                showToast('কর্মচারীর তথ্য সংরক্ষণ হয়েছে।', 'success');
                load();
              });
          } }
        ]);
        el('modalBody').onclick = null;
      }

      /* =====================================================
         রিপোর্ট: PDF (প্রিন্ট → Save as PDF) ও Excel (CSV)
         ===================================================== */
      function printHtml(title, inner) {
        var w = window.open('', '_blank');
        if (!w) { showToast('পপআপ আটকে গেছে — ব্রাউজারে পপআপ অনুমতি দিন।', 'warning'); return; }
        w.document.write('<!DOCTYPE html><html><head><meta charset="utf-8"><title>' + esc(title) + '</title>' +
          '<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">' +
          '<style>body{font-family:"Noto Sans Bengali",Arial,sans-serif;color:#10233F;padding:28px;font-size:13px}h1{font-size:20px;margin:0 0 4px}h2{font-size:15px;margin:22px 0 8px}' +
          '.sub{color:#5b6778;margin-bottom:12px}.emp{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.emp div{border:1px solid #d7dde8;border-radius:8px;padding:8px 12px;min-width:140px}.emp b{display:block;margin-top:2px}' +
          'table{width:100%;border-collapse:collapse;margin-bottom:8px}th,td{border:1px solid #d7dde8;padding:7px 9px;text-align:right}th:first-child,td:first-child{text-align:left}th{background:#f1f5fb}tfoot td{font-weight:700;background:#f8fafc}' +
          '.cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}.sum{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.sum div{border:1px solid #d7dde8;border-radius:8px;padding:10px 14px;min-width:150px}.sum b{display:block;font-size:16px;margin-top:3px}</style></head><body>' +
          inner + '</body></html>');
        w.document.close();
        w.focus();
        setTimeout(function () { w.print(); }, 900);
        showToast('প্রিন্ট উইন্ডোতে "Save as PDF" নির্বাচন করুন।', 'default');
      }

      function empBlock() {
        var e = (state.data && state.data.employee) || {};
        return '<div class="emp"><div>Employee ID<b>' + esc(e.employeeId || '—') + '</b></div><div>Name<b>' + esc(e.name || '—') + '</b></div>' +
          '<div>Designation<b>' + esc(e.designation || '—') + '</b></div><div>Joining Date<b>' + dispShort(e.joiningDate) + '</b></div>' +
          '<div>Next Increment Date<b>' + dispShort(e.nextIncrementDate) + '</b></div></div>';
      }

      function reportTable(title, defs, st, footLabel, footValue) {
        return '<div><table><thead><tr><th>' + title + '</th><th>৳</th></tr></thead><tbody>' +
          defs.map(function (d) { return '<tr><td>' + esc(d[1]) + '</td><td>' + cell(st[d[0]]) + '</td></tr>'; }).join('') +
          '</tbody><tfoot><tr><td>' + footLabel + '</td><td>' + num(footValue) + '</td></tr></tfoot></table></div>';
      }

      function exportStatementPdf() {
        var st = selectedSt();
        if (!st) { showToast('আগে একটি বেতন এন্ট্রি করুন।', 'warning'); return; }
        var t = totals(st);
        printHtml('বেতন স্টেটমেন্ট — ' + monthTitle(st.monthKey),
          '<h1>বেতন স্টেটমেন্ট — ' + esc(monthTitle(st.monthKey)) + '</h1>' + empBlock() +
          '<div class="cols">' + reportTable('আয়/ভাতা (Earnings)', EARN, st, 'মোট আয় (A)', t.gross) +
          reportTable('কর্তন (Deductions)', DEDUCT, st, 'মোট কর্তন (B)', t.ded) +
          reportTable('CPF (Provident Fund)', CPF, cpfView(t), 'মোট CPF (C)', t.cpfTotal) + '</div>' +
          '<div class="sum"><div>গ্রস সেলারি (A)<b>' + money(t.gross) + '</b></div><div>মোট কর্তন (B)<b>' + money(t.ded) + '</b></div>' +
          '<div>হাতে প্রাপ্ত বেতন (A − B)<b>' + money(t.net) + '</b></div></div>' +
          (st.notes ? '<div class="sub">নোট: ' + esc(st.notes) + '</div>' : ''));
      }

      function exportAnnualPdf() {
        var year = selectedYear();
        var rows = yearStatements(year);
        if (!rows.length) { showToast('এই বছরে কোনো বেতন এন্ট্রি নেই।', 'warning'); return; }
        var g = 0, d = 0, n = 0, e = 0, c = 0;
        var trs = rows.map(function (s) {
          var t = totals(s);
          g += t.gross; d += t.ded; n += t.net; e += t.cpfEmp; c += t.cpfComp;
          return '<tr><td>' + monthTitle(s.monthKey) + '</td><td>' + num(t.gross) + '</td><td>' + num(t.ded) + '</td><td>' + num(t.net) + '</td><td>' + num(t.cpfEmp) + '</td><td>' + num(t.cpfComp) + '</td></tr>';
        }).join('');
        printHtml('বার্ষিক বেতন সারাংশ — ' + year,
          '<h1>বার্ষিক বেতন সারাংশ — ' + esc(bn(year)) + '</h1>' + empBlock() +
          '<table><thead><tr><th>মাস</th><th>গ্রস সেলারি</th><th>মোট কর্তন</th><th>হাতে প্রাপ্ত</th><th>Employee CPF</th><th>Company CPF</th></tr></thead><tbody>' + trs +
          '</tbody><tfoot><tr><td>মোট</td><td>' + num(g) + '</td><td>' + num(d) + '</td><td>' + num(n) + '</td><td>' + num(e) + '</td><td>' + num(c) + '</td></tr></tfoot></table>');
      }

      /** yearArg না দিলে বেতন ট্যাবে নির্বাচিত স্টেটমেন্টের বছর ধরা হয়; CPF হিসাব ট্যাব থেকে সেই ট্যাবের বছর পাঠানো হয়। */
      function exportCpfPdf(yearArg) {
        var year = yearArg || selectedYear();
        var rows = cpfYearRecords(year);
        if (!rows.length) { showToast('এই বছরে কোনো CPF এন্ট্রি নেই।', 'warning'); return; }
        var cum = cpfCumulative();
        var e = 0, c = 0;
        var trs = rows.map(function (r) {
          e += r.emp; c += r.comp;
          return '<tr><td>' + monthTitle(r.monthKey) + '</td><td>' + num(r.emp) + '</td><td>' + num(r.comp) + '</td><td>' + num(r.emp + r.comp) + '</td><td>' + num(cum[r.monthKey]) + '</td></tr>';
        }).join('');
        printHtml('CPF সারাংশ — ' + year,
          '<h1>CPF সারাংশ — ' + esc(bn(year)) + '</h1>' + empBlock() +
          '<table><thead><tr><th>মাস</th><th>Employee CPF</th><th>Company CPF</th><th>মোট CPF</th><th>ক্রমযোজিত মোট</th></tr></thead><tbody>' + trs +
          '</tbody><tfoot><tr><td>মোট (' + esc(bn(year)) + ')</td><td>' + num(e) + '</td><td>' + num(c) + '</td><td>' + num(e + c) + '</td><td></td></tr></tfoot></table>');
      }

      function csvCell(v) { return '"' + String(v === undefined || v === null ? '' : v).replace(/"/g, '""') + '"'; }

      function downloadCsv(fileName, lines) {
        var blob = new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
        showToast('এক্সেল ফাইল (CSV) ডাউনলোড হচ্ছে।', 'success');
      }

      function exportExcel() {
        var l = list();
        if (!l.length) { showToast('এক্সপোর্ট করার মতো কোনো এন্ট্রি নেই।', 'warning'); return; }
        var head = ['Month'].concat(ALL_FIELDS.map(function (d) { return d[1]; }), ['Gross (A)', 'Total Deduction (B)', 'Net Pay', 'Total CPF', 'Notes']);
        var lines = [head.map(csvCell).join(',')];
        l.forEach(function (s) {
          var t = totals(s);
          var row = [csvCell(s.monthKey)];
          ALL_FIELDS.forEach(function (d) { row.push(Number(s[d[0]]) || 0); });
          row.push(t.gross, t.ded, t.net, t.cpfTotal, csvCell(s.notes));
          lines.push(row.join(','));
        });
        lines.push('');
        lines.push(['CPF Month', "Employee's CPF", "Company's CPF", 'Total CPF', 'Source'].map(csvCell).join(','));
        cpfRecords().forEach(function (r) {
          lines.push([csvCell(r.monthKey), r.emp, r.comp, r.emp + r.comp, csvCell(r.source === 'statement' ? 'Salary statement' : 'Earlier entry')].join(','));
        });
        downloadCsv('power-grid-salary.csv', lines);
      }

      /** CPF হিসাব ট্যাব: শুধু CPF তালিকা (সব বছর, ক্রমযোজিত মোটসহ) */
      function exportCpfCsv() {
        var recs = cpfRecords();
        if (!recs.length) { showToast('এক্সপোর্ট করার মতো কোনো CPF এন্ট্রি নেই।', 'warning'); return; }
        var cum = cpfCumulative();
        function r2(x) { return Math.round(x * 100) / 100; }
        var lines = [['Month', "Employee's CPF", "Company's CPF", 'Total CPF', 'Cumulative Total', 'Source'].map(csvCell).join(',')];
        recs.forEach(function (r) {
          lines.push([csvCell(r.monthKey), r2(r.emp), r2(r.comp), r2(r.emp + r.comp), r2(cum[r.monthKey]),
            csvCell(r.source === 'statement' ? 'Salary statement' : 'Earlier entry')].join(','));
        });
        downloadCsv('power-grid-cpf.csv', lines);
      }

      /* =====================================================
         ইভেন্ট
         ===================================================== */
      function stepMonth(dir) {
        var keys = list().map(function (s) { return s.monthKey; });
        var i = keys.indexOf(state.sel);
        var j = i + dir;
        if (i < 0 || j < 0 || j >= keys.length) return;
        state.sel = keys[j];
        render();
      }

      root().addEventListener('click', function (e) {
        var b = e.target.closest('[data-act]');
        if (!b || b.disabled) return;
        var act = b.getAttribute('data-act');

        if (act === 'retry') load();
        else if (act === 'add') openEntryModal('');
        else if (act === 'edit-emp') openEmpModal();
        else if (act === 'prev-month') stepMonth(-1);
        else if (act === 'next-month') stepMonth(1);
        else if (act === 'kpi') openKpiDetail(b.getAttribute('data-kind'));
        else if (act === 'all') openAllModal();
        else if (act === 'view') { state.sel = b.getAttribute('data-key'); render(); scrollTop(); }
        else if (act === 'pdf-statement') exportStatementPdf();
        else if (act === 'pdf-annual') exportAnnualPdf();
        else if (act === 'pdf-cpf') exportCpfPdf();
        else if (act === 'excel') exportExcel();
        else if (act === 'cpf-list') openCpfListModal();
        /* CPF হিসাব ট্যাব */
        else if (act === 'cpf-prev-year') stepCpfYear(-1);
        else if (act === 'cpf-next-year') stepCpfYear(1);
        else if (act === 'cpf-year') { state.cpfYear = b.getAttribute('data-year'); renderCpfTab(); }
        else if (act === 'cpf-add') openCpfEntryModal('', firstFreeCpfMonth(state.cpfYear), false);
        else if (act === 'cpf-add-month') openCpfEntryModal('', b.getAttribute('data-key'), false);
        else if (act === 'cpf-edit') openCpfEntryModal(b.getAttribute('data-id'), '', false);
        else if (act === 'cpf-del') confirmDeleteCpf(b.getAttribute('data-id'), false);
        else if (act === 'cpf-open-st') openEntryModal(b.getAttribute('data-key'));
        else if (act === 'cpf-pdf-year') exportCpfPdf(state.cpfYear);
        else if (act === 'cpf-excel') exportCpfCsv();
      });

      /* ---------- পেজ খোলা হলে (এবং লগইনের পরে) লোড ---------- */
      function isActive() { return root().classList.contains('active'); }
      function isAuthed() { return document.body.classList.contains('authenticated'); }

      function maybeLoad() {
        if (!isActive() || !isAuthed()) return;
        if (!state.everLoaded || Date.now() - state.loadedAt > 60000) load();
      }

      new MutationObserver(maybeLoad).observe(root(), { attributes: true, attributeFilter: ['class'] });
      new MutationObserver(maybeLoad).observe(document.body, { attributes: true, attributeFilter: ['class'] });
      maybeLoad();
    })();
  </script>

</section>
